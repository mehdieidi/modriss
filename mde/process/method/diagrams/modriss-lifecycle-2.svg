<marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#087b78"/></marker></defs>
  <rect x="0" y="0" width="1280" height="864" rx="0" fill="#f5f3ed" stroke="#f5f3ed" stroke-width="1"/>
  <text x="48" y="38" text-anchor="start" fill="#075d5b" font-family="Space Grotesk,Segoe UI,sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">MODRISS  /  TWO COORDINATED PROCESSES</text>
  <text x="48" y="82" text-anchor="start" fill="#102c3a" font-family="Georgia,serif" font-size="34" font-weight="400" letter-spacing="0">Two processes, one product lifecycle</text>
  <text x="48" y="110" text-anchor="start" fill="#617178" font-family="Space Grotesk,Segoe UI,sans-serif" font-size="14" font-weight="400" letter-spacing="0">Development delivers releases. Operations sustains the live baseline.</text>
