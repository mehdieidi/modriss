<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 864" role="img" aria-labelledby="modriss-lifecycle-title modriss-lifecycle-desc">
  <title id="modriss-lifecycle-title">MODRISS integrated product lifecycle</title>
  <desc id="modriss-lifecycle-desc">Development and Delivery proceeds through three one-time phases with repeating model-driven increments and releases in the active phase. Concurrent Operations and Maintenance sustains live releases through Kanban. DevOps transfers G7 releases into operations and returns feedback and change to development; both processes close at G8.</desc>
  <defs><style>
.lane { fill: #fcfbf7; stroke: #ccd2cf; }
.node { fill: #fcfbf7; stroke: #ccd2cf; }
</style>
