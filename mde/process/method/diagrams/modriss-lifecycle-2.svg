  <text x="1028" y="291" text-anchor="start" fill="#102c3a" font-family="Georgia,serif" font-size="22" font-weight="400" letter-spacing="0">Retire, verify</text>
  <text x="1028" y="317" text-anchor="start" fill="#102c3a" font-family="Georgia,serif" font-size="22" font-weight="400" letter-spacing="0">&amp; close</text>
