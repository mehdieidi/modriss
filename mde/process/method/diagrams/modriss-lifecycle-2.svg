  <text x="164" y="172" text-anchor="start" fill="#102c3a" font-family="Space Grotesk,Segoe UI,sans-serif" font-size="16" font-weight="700" letter-spacing="0">Development &amp; Delivery</text>
  <text x="1216" y="171" text-anchor="end" fill="#617178" font-family="Space Grotesk,Segoe UI,sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">PHASE 0  →  PHASE 1  →  PHASE 2</text>
