<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1120 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="modriss-lifecycle-title modriss-lifecycle-desc"><title id="modriss-lifecycle-title">MODRISS integrated product lifecycle</title><desc id="modriss-lifecycle-desc">Two coordinated processes: sequential Development and Delivery phases above, and an ongoing event-driven Operations and Maintenance Kanban process below. Release handover, operational feedback, maintenance change, and retirement synchronize the processes.</desc><defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;family=Space+Grotesk:wght@400;500;600&amp;display=swap');</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 8 3 0 6Z" fill="#617178"/></marker><marker id="teal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 8 3 0 6Z" fill="#087b78"/></marker><marker id="red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 8 3 0 6Z" fill="#d6644a"/></marker></defs>
<rect width="1120" height="760" fill="#f5f3ed"/><text class="eyebrow muted" x="42" y="34">INTEGRATED PRODUCT LIFECYCLE · TWO COORDINATED PROCESSES</text><text class="title ink" x="42" y="70">Development delivers releases. Operations sustains live releases.</text><text class="sans muted" font-size="10" x="42" y="94">DevOps coordination joins the processes without misclassifying continuous operation as a sequential phase.</text>
<rect class="lane" x="42" y="128" width="1036" height="258" rx="8"/><rect x="42" y="128" width="150" height="258" rx="8" fill="#ebe8df"/><text class="lane-label ink" x="58" y="154">DEVELOPMENT</text><text class="lane-label ink" x="58" y="170">AND DELIVERY</text><text class="body muted" x="58" y="196">Three sequential</text><text class="body muted" x="58" y="211">one-time phases</text><text class="small muted" x="58" y="354">PHASES NEVER REPEAT</text>
<g transform="translate(216 174)"><rect class="node" width="164" height="154" rx="6"/><text class="tag muted" x="14" y="25">PHASE 0 · ONCE</text><text class="head ink" x="14" y="50">Inception, Tailoring</text><text class="head ink" x="14" y="67">and Organization</text><line class="hair" x1="14" y1="80" x2="150" y2="80"/><text class="body muted" x="14" y="101">Value · feasibility · profile</text><text class="body muted" x="14" y="118">teams · quality · ops baseline</text><text class="small accent" x="14" y="140">G0 → G1</text></g>
<g transform="translate(414 150)"><rect class="focus" width="396" height="202" rx="6"/><text class="tag accent" x="14" y="25">PHASE 1 · ONCE · ACTIVE PRODUCT LIFE</text><text class="head ink" x="14" y="47">Active Product Construction and Evolution</text><line class="hair" x1="14" y1="60" x2="382" y2="60"/><g transform="translate(14 76)"><rect class="node" width="170" height="90" rx="5"/><text class="tag accent" x="12" y="20">ITERATION · REPEATS</text><text class="head ink" x="12" y="42">Model-driven increment</text><text class="body muted" x="12" y="61">CIM → PIM → PSM</text><text class="small accent" x="12" y="79">G2 → G5</text></g><g transform="translate(212 76)"><rect class="node" width="170" height="90" rx="5"/><text class="tag accent" x="12" y="20">ACTIVITIES · REPEAT</text><text class="head ink" x="12" y="42">Qualify and release</text><text class="body muted" x="12" y="61">promote · hand over</text><text class="small accent" x="12" y="79">G6 → G7</text></g><path class="flow" d="M184 121H212" marker-end="url(#arrow)"/><path class="feedback" d="M297 166V188H99V166" marker-end="url(#teal)"/><text class="small accent" x="198" y="196" text-anchor="middle">NEXT RELEASE ITERATION · NOT A PHASE LOOP</text></g>
<g transform="translate(846 174)"><rect class="node" width="190" height="154" rx="6"/><text class="tag muted" x="14" y="25">PHASE 2 · ONCE AUTHORIZED</text><text class="head ink" x="14" y="50">Retire, Migrate and Close</text><line class="hair" x1="14" y1="64" x2="176" y2="64"/><text class="body muted" x="14" y="86">migrate · decommission</text><text class="body muted" x="14" y="103">retain evidence · close duties</text><text class="body muted" x="14" y="120">operations protects service</text><text class="small accent" x="14" y="140">G8 · CLOSED</text></g>
<path class="flow" d="M380 251H414" marker-end="url(#arrow)"/><path class="flow" d="M810 251H846" marker-end="url(#arrow)"/>
<rect class="lane" x="42" y="456" width="1036" height="210" rx="8"/><rect x="42" y="456" width="150" height="210" rx="8" fill="#ebe8df"/><text class="lane-label ink" x="58" y="482">OPERATIONS</text><text class="lane-label ink" x="58" y="498">AND MAINTENANCE</text><text class="body muted" x="58" y="524">Ongoing + event-driven</text><text class="body muted" x="58" y="539">Kanban service flow</text><text class="small coral" x="58" y="634">NOT A PHASE</text>
<g transform="translate(216 494)"><rect class="ops" width="820" height="126" rx="6"/><text class="tag coral" x="16" y="24">LIVE RELEASE SERVICE SYSTEM · STARTS AT FIRST G7 · ENDS AT G8</text><text class="head ink" x="16" y="51">Observe → Replenish and Pull → Restore / Maintain → Verify and Reconcile → Learn</text><line class="hair" x1="16" y1="65" x2="804" y2="65"/><text class="body muted" x="16" y="86">Requested  →  Ready  →  In Progress  →  Verify  →  Done</text><text class="body muted" x="16" y="104">Explicit WIP · service classes · SLE · item age · throughput · operations evidence</text></g>
<path class="sync" d="M711 316V494" marker-end="url(#red)"/><path class="feedback" d="M462 494V419H513V316" marker-end="url(#teal)"/><path class="sync" d="M938 494V328" marker-end="url(#red)"/><rect x="192" y="396" width="844" height="46" rx="6" fill="#ebe8df" stroke="#ccd2cf"/><text class="tag ink" x="208" y="414">DEVOPS COORDINATION INTERFACE · BETWEEN THE PROCESSES</text><text class="body muted" x="208" y="430">CI/CD + G7 handover ↓ · telemetry + service change + learning ↑ · retirement + G8 coordination ↕</text><text class="small muted" x="42" y="700">SOLID = PHASE / HANDOVER FLOW · DASHED = FEEDBACK / CONTROLLED RE-ENTRY · CORAL = CROSS-PROCESS SYNCHRONIZATION</text>
</svg>
