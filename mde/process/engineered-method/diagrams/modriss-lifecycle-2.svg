<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 792" role="img" aria-labelledby="modriss-deljouyi-title modriss-deljouyi-desc">
  <title id="modriss-deljouyi-title">MODRISS full-lifecycle process map</title>
  <desc id="modriss-deljouyi-desc">An English phase-oriented process map showing initiation, a large nested model-driven delivery phase, release, operation, retirement, iteration and change feedback, and continuous engineering disciplines.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;display=swap');</style>
    <style>
      .sans{font-family:'Geist',system-ui,sans-serif}.serif{font-family:'Instrument Serif','Noto Serif',serif}.mono{font-family:'Geist Mono',ui-monospace,monospace}
      .ink{fill:#2d3142}.muted{fill:#4f5d75}.soft{fill:#7a8399}.accent{fill:#eb6c36}
      .eyebrow{font:500 8px 'Geist Mono',ui-monospace,monospace;letter-spacing:.18em}.title{font:400 32px 'Instrument Serif','Noto Serif',serif}.subtitle{font:400 10px 'Geist',system-ui,sans-serif}
      .phase-tag{font:600 8px 'Geist Mono',ui-monospace,monospace;letter-spacing:.12em}.phase-name{font:600 12px 'Geist',system-ui,sans-serif}.zone-name{font:500 8px 'Geist Mono',ui-monospace,monospace;letter-spacing:.1em}
      .node-name{font:600 10px 'Geist',system-ui,sans-serif}.node-detail{font:400 8px 'Geist',system-ui,sans-serif}.node-tech{font:500 7px 'Geist Mono',ui-monospace,monospace;letter-spacing:.04em}
      .rail-title{font:600 9px 'Geist Mono',ui-monospace,monospace;letter-spacing:.12em}.rail-text{font:400 9px 'Geist',system-ui,sans-serif}.legend-key{font:500 8px 'Geist Mono',ui-monospace,monospace;letter-spacing:.12em}.legend-text{font:400 9px 'Geist',system-ui,sans-serif}
      .phase{fill:#fff;stroke:#bfc0c0;stroke-width:1}.phase-focal{fill:#fdf8f5;stroke:#eb6c36;stroke-width:1.4}.zone{fill:#f8f8f8;stroke:#bfc0c0;stroke-width:.8}.zone-focal{fill:#fff;stroke:#eb6c36;stroke-opacity:.5;stroke-width:1}
      .node{fill:#fff;stroke:#4f5d75;stroke-opacity:.42;stroke-width:1}.node-soft{fill:#ececec;stroke:#bfc0c0;stroke-width:1}.node-focal{fill:#fdf0ea;stroke:#eb6c36;stroke-width:1.2}.gate-node{fill:#fff;stroke:#4f5d75;stroke-width:1.2}
      .flow{fill:none;stroke:#4f5d75;stroke-width:1.15}.flow-accent{fill:none;stroke:#eb6c36;stroke-width:1.35}.feedback{fill:none;stroke:#4f5d75;stroke-width:1;stroke-dasharray:5 4}.hair{stroke:#bfc0c0;stroke-width:.8}
    </style>
    <marker id="deljouyi-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
    <marker id="deljouyi-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
    <marker id="deljouyi-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
  </defs>

  <rect width="1120" height="792" fill="#f5f5f5"/>
  <text class="eyebrow muted" x="40" y="28">MODEL-DRIVEN METHODOLOGY · END-TO-END SERVERLESS LIFECYCLE</text>
  <text class="title ink" x="40" y="64">MODRISS lifecycle process map</text>
  <text class="subtitle muted" x="40" y="88">Phase-oriented view with nested model-driven construction, controlled iteration, operational learning, and lifecycle governance</text>

  <!-- Phase and subphase zones. These establish grouping and sit behind all flows. -->
  <rect class="phase" x="40" y="224" width="120" height="296" rx="16"/>
  <rect class="phase-focal" x="172" y="132" width="504" height="436" rx="20"/>
  <rect class="phase" x="688" y="224" width="128" height="296" rx="16"/>
  <rect class="phase" x="828" y="224" width="128" height="296" rx="16"/>
  <rect class="phase" x="968" y="224" width="112" height="296" rx="16"/>

  <rect class="zone" x="188" y="188" width="144" height="312" rx="8"/>
  <rect class="zone-focal" x="344" y="176" width="160" height="336" rx="8"/>
  <rect class="zone" x="516" y="188" width="144" height="312" rx="8"/>

  <!-- Phase-level flow and internal model-driven flow. Connectors precede task nodes. -->
  <line class="flow-accent" x1="160" y1="344" x2="172" y2="344" marker-end="url(#deljouyi-arrow-accent)"/>
  <line class="flow" x1="676" y1="344" x2="688" y2="344" marker-end="url(#deljouyi-arrow)"/>
  <line class="flow" x1="816" y1="344" x2="828" y2="344" marker-end="url(#deljouyi-arrow)"/>
  <line class="flow" x1="956" y1="344" x2="968" y2="344" marker-end="url(#deljouyi-arrow)"/>

  <line class="flow" x1="260" y1="288" x2="260" y2="316" marker-end="url(#deljouyi-arrow)"/>
  <line class="flow" x1="260" y1="368" x2="260" y2="396" marker-end="url(#deljouyi-arrow)"/>
  <path class="flow-accent" d="M320 422 H344 Q352 422 352 414 V332" marker-end="url(#deljouyi-arrow-accent)"/>

  <line class="flow-accent" x1="424" y1="272" x2="424" y2="292" marker-end="url(#deljouyi-arrow-accent)"/>
  <line class="flow-accent" x1="424" y1="324" x2="424" y2="344" marker-end="url(#deljouyi-arrow-accent)"/>
  <line class="flow-accent" x1="424" y1="396" x2="424" y2="416" marker-end="url(#deljouyi-arrow-accent)"/>
  <line class="flow-accent" x1="424" y1="448" x2="424" y2="468" marker-end="url(#deljouyi-arrow-accent)"/>
  <path class="flow-accent" d="M492 492 H508 Q516 492 516 484 V262 H528" marker-end="url(#deljouyi-arrow-accent)"/>

  <line class="flow" x1="588" y1="288" x2="588" y2="336" marker-end="url(#deljouyi-arrow)"/>
  <line class="flow" x1="588" y1="388" x2="588" y2="436" marker-end="url(#deljouyi-arrow)"/>

  <line class="flow" x1="100" y1="332" x2="100" y2="360" marker-end="url(#deljouyi-arrow)"/>
  <line class="flow" x1="100" y1="412" x2="100" y2="440" marker-end="url(#deljouyi-arrow)"/>
  <line class="flow" x1="752" y1="336" x2="752" y2="364" marker-end="url(#deljouyi-arrow)"/>
  <line class="flow" x1="752" y1="416" x2="752" y2="444" marker-end="url(#deljouyi-arrow)"/>
  <line class="flow" x1="892" y1="336" x2="892" y2="364" marker-end="url(#deljouyi-arrow)"/>
  <line class="flow" x1="892" y1="416" x2="892" y2="444" marker-end="url(#deljouyi-arrow)"/>
  <line class="flow" x1="1024" y1="336" x2="1024" y2="364" marker-end="url(#deljouyi-arrow)"/>
  <line class="flow" x1="1024" y1="416" x2="1024" y2="444" marker-end="url(#deljouyi-arrow)"/>

  <!-- Iteration inside Phase 1. -->
  <path class="feedback" d="M588 488 V540 Q588 548 580 548 H268 Q260 548 260 540 V448" marker-end="url(#deljouyi-arrow)"/>
  <rect x="360" y="520" width="128" height="12" rx="2" fill="#f5f5f5"/>
  <text class="node-tech muted" x="424" y="529" text-anchor="middle">REWORK · NEXT INCREMENT</text>

  <!-- Operational evidence returns to the earliest authoritative model. -->
  <path class="feedback" d="M892 496 V592 Q892 600 884 600 H432 Q424 600 424 592 V568" marker-end="url(#deljouyi-arrow)"/>
  <rect x="548" y="576" width="220" height="12" rx="2" fill="#f5f5f5"/>
  <text class="node-tech muted" x="658" y="585" text-anchor="middle">NEXT RELEASE / CHANGE RE-ENTRY</text>

  <!-- Phase headings. -->
  <text class="phase-tag muted" x="100" y="248" text-anchor="middle">PHASE 0</text>
  <text class="phase-name ink" x="100" y="268" text-anchor="middle">Initiate &amp; Tailor</text>

  <text class="phase-tag accent" x="424" y="152" text-anchor="middle">PHASE 1 · ITERATIVE-INCREMENTAL</text>
  <text class="phase-name ink" x="424" y="168" text-anchor="middle">Model-Driven Delivery</text>

  <text class="phase-tag muted" x="752" y="248" text-anchor="middle">PHASE 2</text>
  <text class="phase-name ink" x="752" y="268" text-anchor="middle">Release &amp; Transition</text>

  <text class="phase-tag muted" x="892" y="248" text-anchor="middle">PHASE 3</text>
  <text class="phase-name ink" x="892" y="268" text-anchor="middle">Operate &amp; Evolve</text>

  <text class="phase-tag muted" x="1024" y="248" text-anchor="middle">PHASE 4</text>
  <text class="phase-name ink" x="1024" y="268" text-anchor="middle">Retire &amp; Close</text>

  <text class="zone-name muted" x="260" y="208" text-anchor="middle">ANALYSIS &amp; CIM</text>
  <text class="zone-name accent" x="424" y="196" text-anchor="middle">MODEL REFINEMENT</text>
  <text class="zone-name muted" x="588" y="208" text-anchor="middle">REALIZATION &amp; TEST</text>

  <!-- Phase 0 task nodes. -->
  <g>
    <rect class="node" x="52" y="284" width="96" height="48" rx="6"/>
    <text class="node-name ink" x="100" y="303" text-anchor="middle">Frame opportunity</text>
    <text class="node-detail muted" x="100" y="317" text-anchor="middle">value · scope · outcomes</text>

    <rect class="node" x="52" y="360" width="96" height="52" rx="6"/>
    <text class="node-name ink" x="100" y="379" text-anchor="middle">Assess suitability</text>
    <text class="node-detail muted" x="100" y="393" text-anchor="middle">cost · risk · provider</text>

    <rect class="gate-node" x="52" y="440" width="96" height="52" rx="6"/>
    <text class="node-name ink" x="100" y="459" text-anchor="middle">Tailor &amp; organize</text>
    <text class="node-tech muted" x="100" y="475" text-anchor="middle">G0 · G1</text>
  </g>

  <!-- Phase 1: analysis and CIM. -->
  <g>
    <rect class="node" x="200" y="236" width="120" height="52" rx="6"/>
    <text class="node-name ink" x="260" y="255" text-anchor="middle">Frame increment</text>
    <text class="node-detail muted" x="260" y="269" text-anchor="middle">valuable vertical slice</text>

    <rect class="node" x="200" y="316" width="120" height="52" rx="6"/>
    <text class="node-name ink" x="260" y="335" text-anchor="middle">Requirements &amp; quality</text>
    <text class="node-detail muted" x="260" y="349" text-anchor="middle">scenarios · evidence</text>

    <rect class="gate-node" x="200" y="396" width="120" height="52" rx="6"/>
    <text class="node-name ink" x="260" y="415" text-anchor="middle">Discover the CIM</text>
    <text class="node-tech muted" x="260" y="431" text-anchor="middle">G2 · CIM ACCEPTED</text>
  </g>

  <!-- Phase 1: model-refinement spine. -->
  <g>
    <rect class="node-focal" x="356" y="220" width="136" height="52" rx="6"/>
    <text class="node-name ink" x="424" y="239" text-anchor="middle">CIM baseline</text>
    <text class="node-detail muted" x="424" y="253" text-anchor="middle">intent · domain · requirements</text>

    <rect class="node-soft" x="372" y="292" width="104" height="32" rx="4"/>
    <text class="node-tech accent" x="424" y="312" text-anchor="middle">ETL · RECONCILE</text>

    <rect class="gate-node" x="356" y="344" width="136" height="52" rx="6"/>
    <text class="node-name ink" x="424" y="363" text-anchor="middle">PIM architecture</text>
    <text class="node-tech muted" x="424" y="379" text-anchor="middle">G3 · PLATFORM-MAPPABLE</text>

    <rect class="node-soft" x="372" y="416" width="104" height="32" rx="4"/>
    <text class="node-tech accent" x="424" y="436" text-anchor="middle">ETL · RECONCILE</text>

    <rect class="gate-node" x="356" y="468" width="136" height="48" rx="6"/>
    <text class="node-name ink" x="424" y="487" text-anchor="middle">AWS PSM</text>
    <text class="node-tech muted" x="424" y="503" text-anchor="middle">G4 · GENERABLE</text>
  </g>

  <!-- Phase 1: realization and test. -->
  <g>
    <rect class="node" x="528" y="236" width="120" height="52" rx="6"/>
    <text class="node-name ink" x="588" y="255" text-anchor="middle">Generate artifacts</text>
    <text class="node-detail muted" x="588" y="269" text-anchor="middle">EGL/EGX · manifest · trace</text>

    <rect class="node" x="528" y="336" width="120" height="52" rx="6"/>
    <text class="node-name ink" x="588" y="355" text-anchor="middle">Complete &amp; verify</text>
    <text class="node-detail muted" x="588" y="369" text-anchor="middle">code · contracts · policies</text>

    <rect class="gate-node" x="528" y="436" width="120" height="52" rx="6"/>
    <text class="node-name ink" x="588" y="455" text-anchor="middle">Integrate &amp; accept</text>
    <text class="node-tech muted" x="588" y="471" text-anchor="middle">G5 · INCREMENT ACCEPTED</text>
  </g>

  <!-- Phase 2 task nodes. -->
  <g>
    <rect class="node" x="700" y="284" width="104" height="52" rx="6"/>
    <text class="node-name ink" x="752" y="303" text-anchor="middle">Assemble candidate</text>
    <text class="node-detail muted" x="752" y="317" text-anchor="middle">immutable revisions</text>

    <rect class="gate-node" x="700" y="364" width="104" height="52" rx="6"/>
    <text class="node-name ink" x="752" y="383" text-anchor="middle">Qualify &amp; authorize</text>
    <text class="node-tech muted" x="752" y="399" text-anchor="middle">G6 · RECOVERY READY</text>

    <rect class="gate-node" x="700" y="444" width="104" height="52" rx="6"/>
    <text class="node-name ink" x="752" y="463" text-anchor="middle">Promote &amp; hand over</text>
    <text class="node-tech muted" x="752" y="479" text-anchor="middle">G7 · TRANSITIONED</text>
  </g>

  <!-- Phase 3 task nodes. -->
  <g>
    <rect class="node" x="840" y="284" width="104" height="52" rx="6"/>
    <text class="node-name ink" x="892" y="303" text-anchor="middle">Observe outcomes</text>
    <text class="node-detail muted" x="892" y="317" text-anchor="middle">SLOs · security · cost</text>

    <rect class="node" x="840" y="364" width="104" height="52" rx="6"/>
    <text class="node-name ink" x="892" y="383" text-anchor="middle">Respond &amp; recover</text>
    <text class="node-detail muted" x="892" y="397" text-anchor="middle">incident · problem</text>

    <rect class="gate-node" x="840" y="444" width="104" height="52" rx="6"/>
    <text class="node-name ink" x="892" y="463" text-anchor="middle">Classify change</text>
    <text class="node-detail muted" x="892" y="477" text-anchor="middle">evolve · learn · generalize</text>
  </g>

  <!-- Phase 4 task nodes. -->
  <g>
    <rect class="node" x="980" y="284" width="88" height="52" rx="6"/>
    <text class="node-name ink" x="1024" y="303" text-anchor="middle">Plan retirement</text>
    <text class="node-detail muted" x="1024" y="317" text-anchor="middle">users · data · duties</text>

    <rect class="node" x="980" y="364" width="88" height="52" rx="6"/>
    <text class="node-name ink" x="1024" y="383" text-anchor="middle">Migrate &amp;</text>
    <text class="node-name ink" x="1024" y="397" text-anchor="middle">decommission</text>

    <rect class="gate-node" x="980" y="444" width="88" height="52" rx="6"/>
    <text class="node-name ink" x="1024" y="463" text-anchor="middle">Verify closure</text>
    <text class="node-tech muted" x="1024" y="479" text-anchor="middle">G8 · CLOSED</text>
  </g>

  <!-- Cross-cutting disciplines echo the full-width umbrella arrow in the reference figure. -->
  <path d="M40 648 L64 628 H1056 L1080 648 L1056 668 H64 Z" fill="#ececec" stroke="#bfc0c0" stroke-width="1"/>
  <text class="rail-title ink" x="560" y="646" text-anchor="middle">CONTINUOUS DISCIPLINES</text>
  <text class="rail-text muted" x="560" y="660" text-anchor="middle">product &amp; project management · risk · quality · security/privacy · configuration/change · trace/evidence · FinOps · measurement · knowledge/reuse · team dependencies</text>

  <!-- Bottom legend strip. -->
  <line class="hair" x1="40" y1="720" x2="1080" y2="720"/>
  <text class="legend-key muted" x="40" y="744">LEGEND</text>
  <line class="flow" x1="112" y1="740" x2="144" y2="740" marker-end="url(#deljouyi-arrow)"/>
  <text class="legend-text muted" x="156" y="744">primary lifecycle flow</text>
  <line class="feedback" x1="304" y1="740" x2="336" y2="740" marker-end="url(#deljouyi-arrow)"/>
  <text class="legend-text muted" x="348" y="744">iteration and controlled re-entry</text>
  <rect x="568" y="732" width="20" height="16" rx="3" fill="#fdf0ea" stroke="#eb6c36"/>
  <text class="legend-text muted" x="600" y="744">model-driven delivery focus</text>
  <text class="legend-key soft" x="1080" y="744" text-anchor="end">SPEM-STRUCTURED · EVIDENCE-GATED · TAILORABLE</text>

  <text class="node-tech soft" x="40" y="772">PHASES EXPRESS DOMINANT OBJECTIVES; ITERATION, OVERLAP, AND RISK-BASED TAILORING ARE EXPECTED.</text>
</svg>
