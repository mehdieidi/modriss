<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CVS Studio — Concrete Visual Syntax Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="28" height="28">
              <rect
                x="2"
                y="6"
                width="28"
                height="20"
                rx="6"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              />
              <path
                d="M8 14h8M8 18h14"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
          </div>
          <div>
            <strong>CVS Studio</strong>
            <span id="docTitle">No document</span>
          </div>
        </div>
        <div class="topbar-actions">
          <span class="level-badge" id="levelBadge">—</span>
          <span class="dirty-badge hidden" id="dirtyBadge">Unsaved</span>
          <div class="btn-group">
            <button type="button" class="btn ghost" id="newCimBtn" title="New CIM">CIM</button>
            <button type="button" class="btn ghost" id="newPimBtn" title="New PIM">PIM</button>
            <button type="button" class="btn ghost" id="newPsmBtn" title="New PSM">PSM</button>
          </div>
          <button type="button" class="btn ghost" id="loadBtn">Load CVS</button>
          <button type="button" class="btn primary" id="exportBtn">Export CVS</button>
          <input type="file" id="fileInput" accept=".json,application/json" hidden />
        </div>
      </header>

      <div class="workspace">
        <nav class="sidebar" aria-label="Editor sections">
          <button type="button" class="nav-item active" data-section="overview">
            <span class="nav-icon">◈</span> Overview
          </button>
          <button type="button" class="nav-item" data-section="elements">
            <span class="nav-icon">▣</span> Elements
          </button>
          <button type="button" class="nav-item" data-section="primitives">
            <span class="nav-icon">⬡</span> Primitives
          </button>
          <button type="button" class="nav-item" data-section="packages">
            <span class="nav-icon">◫</span> Package rules
          </button>
          <button type="button" class="nav-item" data-section="viewpoints">
            <span class="nav-icon">▦</span> Viewpoints
          </button>
          <button type="button" class="nav-item" data-section="canvas">
            <span class="nav-icon">⊞</span> Canvas
          </button>
          <button type="button" class="nav-item" data-section="relationships">
            <span class="nav-icon">↔</span> Relationships
          </button>
          <button type="button" class="nav-item" data-section="badges">
            <span class="nav-icon">◉</span> Badges
          </button>
          <button type="button" class="nav-item" data-section="advanced">
            <span class="nav-icon">{ }</span> Advanced
          </button>
        </nav>

        <main class="main" id="mainContent">
          <div class="empty-state">
            <h2>Welcome to CVS Studio</h2>
            <p>
              Load <code>mde/notation/cim.cvs.json</code> (or PIM/PSM) to start editing visually.
            </p>
            <p class="hint">
              Drag & drop a <code>.json</code> file anywhere, or use <strong>Load CVS</strong>.
            </p>
          </div>
        </main>
      </div>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
