name: modless

services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-modless}
      POSTGRES_USER: ${POSTGRES_USER:-modless}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-modless}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - modless-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MODLESS_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-modless}
      MODLESS_DB_USER: ${POSTGRES_USER:-modless}
      MODLESS_DB_PASSWORD: ${POSTGRES_PASSWORD:-modless}
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  modless-postgres-data:
