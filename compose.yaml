name: modless

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-modless}
      POSTGRES_USER: ${POSTGRES_USER:-modless}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-modless}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - modless-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MODLESS_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-modless}
      MODLESS_DB_USER: ${POSTGRES_USER:-modless}
      MODLESS_DB_PASSWORD: ${POSTGRES_PASSWORD:-modless}
      SPRING_PROFILES_ACTIVE: prod
      MODLESS_AI_ENABLED: ${MODLESS_AI_ENABLED:-false}
      MODLESS_AI_MODE: ${MODLESS_AI_MODE:-EXPLAIN_ONLY}
      MODLESS_AI_PROVIDER: ${MODLESS_AI_PROVIDER:-groq}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MODLESS_AI_PLANNER_MODEL: ${MODLESS_AI_PLANNER_MODEL:-openai/gpt-oss-120b}
      MODLESS_AI_RESPONDER_MODEL: ${MODLESS_AI_RESPONDER_MODEL:-openai/gpt-oss-120b}
      MODLESS_AI_SUMMARIZER_MODEL: ${MODLESS_AI_SUMMARIZER_MODEL:-openai/gpt-oss-120b}
      MODLESS_AI_PROXY_ENABLED: ${MODLESS_AI_PROXY_ENABLED:-true}
      MODLESS_AI_PROXY_TYPE: ${MODLESS_AI_PROXY_TYPE:-HTTP}
      MODLESS_AI_PROXY_HOST: ${MODLESS_AI_PROXY_HOST:-host.docker.internal}
      MODLESS_AI_PROXY_PORT: ${MODLESS_AI_PROXY_PORT:-2081}
      MODLESS_AI_EMBEDDINGS_PROVIDER: ${MODLESS_AI_EMBEDDINGS_PROVIDER:-ONNX}
      MODLESS_AI_EMBEDDINGS_FALLBACK_TO_HASH: ${MODLESS_AI_EMBEDDINGS_FALLBACK_TO_HASH:-true}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    image: python:3.13-alpine
    command: [ "python3", "-m", "http.server", "--bind", "0.0.0.0", "8082", "--directory", "/app" ]
    ports:
      - "${FRONTEND_PORT:-8082}:8082"
    volumes:
      - ./apps/frontend:/app:ro
    restart: unless-stopped

  landing:
    image: python:3.13-alpine
    command: [ "python3", "-m", "http.server", "--bind", "0.0.0.0", "8083", "--directory", "/app" ]
    ports:
      - "${LANDING_PORT:-8083}:8083"
    volumes:
      - ./apps/landing:/app:ro
    restart: unless-stopped

volumes:
  modless-postgres-data:
