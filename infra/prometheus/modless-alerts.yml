groups:
  - name: modless
    rules:
      - alert: ModlessBackendDown
        expr: up{job="modless-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Modless backend is unreachable
          description: Prometheus cannot scrape the Modless backend target.

      - alert: ModlessHighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{application="modless-backend",status=~"5.."}[5m]))
          /
          sum(rate(http_server_requests_seconds_count{application="modless-backend"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Modless 5xx error rate above 5%

      - alert: ModlessDatabasePoolExhausted
        expr: |
          hikaricp_connections_active{application="modless-backend"}
          /
          hikaricp_connections_max{application="modless-backend"} > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: HikariCP pool above 90% utilization

      - alert: ModlessMdeJobFailures
        expr: increase(modless_mde_jobs_failed_total[15m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Elevated MDE job failure count

      - alert: ModlessAssistantCircuitOpen
        expr: increase(modless_assistant_circuit_open_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Assistant circuit breaker rejected provider calls
