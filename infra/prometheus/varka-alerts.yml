groups:
  - name: varka
    rules:
      - alert: VarkaBackendDown
        expr: up{job="varka-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Varka backend is unreachable
          description: Prometheus cannot scrape the Varka backend target.

      - alert: VarkaHighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{application="varka-backend",status=~"5.."}[5m]))
          /
          sum(rate(http_server_requests_seconds_count{application="varka-backend"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Varka 5xx error rate above 5%

      - alert: VarkaDatabasePoolExhausted
        expr: |
          hikaricp_connections_active{application="varka-backend"}
          /
          hikaricp_connections_max{application="varka-backend"} > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: HikariCP pool above 90% utilization

      - alert: VarkaMdeJobFailures
        expr: increase(varka_mde_jobs_failed_total[15m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Elevated MDE job failure count

      - alert: VarkaAssistantCircuitOpen
        expr: increase(varka_assistant_circuit_open_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Assistant circuit breaker rejected provider calls

      - alert: VarkaAssistantProviderErrors
        expr: increase(varka_assistant_provider_calls_total{result="failure"}[10m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Assistant provider calls are failing

      - alert: VarkaAssistantDeadlineBreaches
        expr: increase(varka_assistant_turn_outcome_total{outcome="TIMED_OUT"}[10m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Assistant turns are exceeding the durable deadline

      - alert: VarkaAssistantPartialTurnRate
        expr: increase(varka_assistant_turn_outcome_total{outcome="PARTIAL"}[30m]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Assistant partial-turn rate is elevated

      - alert: VarkaAssistantStructuralFailures
        expr: increase(varka_assistant_turn_outcome_total{outcome=~"FAILED|CONFLICTED"}[15m]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Assistant durable turns are failing or conflicting

      - alert: VarkaAssistantZeroProgressTurns
        expr: increase(varka_assistant_turn_outcome_total{outcome="PARTIAL"}[15m]) > 0 and increase(varka_assistant_phase_seconds_count{phase="durable_turn"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Assistant turns are completing without full progress

      - alert: VarkaAssistantQueueLatencySlo
        expr: histogram_quantile(0.95, sum(rate(varka_assistant_phase_seconds_bucket{phase="queue"}[15m])) by (le)) > 30
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Assistant queue p95 exceeds the 30 second SLO

      - alert: VarkaAssistantTurnLatencySlo
        expr: histogram_quantile(0.95, sum(rate(varka_assistant_phase_seconds_bucket{phase="durable_turn"}[15m])) by (le)) > 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Assistant end-to-end turn p95 exceeds the five minute SLO

      - alert: VarkaAssistantSuccessRateSlo
        expr: |
          sum(rate(varka_assistant_turn_outcome_total{outcome=~"SUCCEEDED|PARTIAL"}[30m]))
          / clamp_min(sum(rate(varka_assistant_turn_outcome_total[30m])), 1) < 0.90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Assistant durable-turn success rate is below 90 percent

      - alert: VarkaAssistantStructuralValiditySlo
        expr: |
          sum(rate(varka_assistant_structural_validation_total{result="invalid"}[30m]))
          / clamp_min(sum(rate(varka_assistant_structural_validation_total[30m])), 1) > 0.05
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Assistant structural-validation failure rate exceeds five percent

      - alert: VarkaEdgeDown
        expr: up{job="varka-caddy"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Caddy edge proxy metrics are unreachable

      - alert: VarkaPostgresExporterDown
        expr: up{job="varka-postgres"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: PostgreSQL exporter is unreachable

      - alert: VarkaContainerTelemetryDown
        expr: up{job="varka-containers"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Container metrics exporter is unreachable

      - alert: VarkaHostTelemetryDown
        expr: up{job="varka-host"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Host metrics exporter is unreachable

      - alert: VarkaHostDiskFilling
        expr: |
          (
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
            /
            node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}
          ) < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Host filesystem has less than 15% free space

      - alert: VarkaFrontendErrors
        expr: increase(varka_frontend_telemetry_events_total{kind=~"js_error|unhandled_rejection"}[15m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Browser-side frontend errors have been reported

      - alert: VarkaObservabilityTargetDown
        expr: up{job="varka-observability"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: One or more observability services are unreachable
