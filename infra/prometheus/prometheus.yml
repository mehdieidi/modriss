global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/modriss-alerts.yml

scrape_configs:
  - job_name: modriss-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - backend:8080

  - job_name: modriss-caddy
    metrics_path: /metrics
    static_configs:
      - targets:
          - caddy:2019

  - job_name: modriss-postgres
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: modriss-containers
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: modriss-host
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: modriss-observability
    static_configs:
      - targets:
          - prometheus:9090
          - loki:3100
          - promtail:9080
          - grafana:3000
