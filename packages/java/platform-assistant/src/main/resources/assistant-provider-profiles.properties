# LLM provider capability profiles for the modeling assistant.
#
# The runtime builds a fingerprint from provider key, model name, and base URL, then picks the
# first rule whose comma-separated match values occur in that fingerprint. Add or tune providers
# here instead of changing Java code.
#
# native-tools-preferred accepts true, false, or auto. auto means "use native tools only when the
# active OpenAI-compatible protocol is tools".

profiles.standard.max-completion-tokens=4096
profiles.standard.max-patch-creates=12
profiles.standard.max-patch-connections=18
profiles.standard.max-patch-evidence=12
profiles.standard.max-contract-count=8
profiles.standard.native-tools-preferred=auto
profiles.standard.forced-tool-choice-reliable=true

profiles.conservative.max-completion-tokens=4096
profiles.conservative.max-patch-creates=6
profiles.conservative.max-patch-connections=8
profiles.conservative.max-patch-evidence=6
profiles.conservative.max-contract-count=5
profiles.conservative.native-tools-preferred=true
profiles.conservative.forced-tool-choice-reliable=false

provider-rules.0.name=Freemodel
provider-rules.0.match=freemodel,free-model
provider-rules.0.profile=conservative

provider-rules.1.name=FreeLLM local container
provider-rules.1.match=freellm,host.docker.internal:3001,localhost:3001,127.0.0.1:3001
provider-rules.1.profile=conservative
