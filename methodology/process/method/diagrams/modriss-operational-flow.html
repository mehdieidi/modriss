<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MODRISS Kanban service-delivery and maintenance system</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;family=Space+Grotesk:wght@400;500;600&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f5f3ed;
        color: #102c3a;
        font-family: "Space Grotesk", "Segoe UI", sans-serif;
      }
      main {
        width: min(100%, 1280px);
      }
      svg {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <svg
        viewBox="0 0 1280 720"
        xmlns="http://www.w3.org/2000/svg"
        role="img"
        aria-labelledby="ops-flow-title ops-flow-desc"
      >
        <title id="ops-flow-title">MODRISS Kanban service-delivery and maintenance system</title>
        <desc id="ops-flow-desc">
          A five-column Kanban board visualizes service work from Requested through Ready, In
          Progress, Verify, and Done, with explicit WIP controls, classes of service, feedback
          cadences, and routes to operations-only completion, a bounded model-driven change, or a
          planned release.
        </desc>
        <defs>
          <pattern id="ops-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="11" cy="11" r="0.8" fill="#102c3a" opacity="0.08" />
          </pattern>
          <style>
            .title {
              font:
                400 32px Georgia,
                "Times New Roman",
                serif;
              fill: #102c3a;
            }
            .subtitle {
              font:
                400 12px "Space Grotesk",
                "Segoe UI",
                sans-serif;
              fill: #617178;
            }
            .eyebrow,
            .column-meta,
            .lane-label,
            .card-type,
            .legend-key {
              font-family: "Geist Mono", ui-monospace, monospace;
            }
            .eyebrow {
              font-size: 8px;
              font-weight: 500;
              letter-spacing: 0.18em;
              fill: #075d5b;
            }
            .column-name {
              font:
                600 12px "Space Grotesk",
                "Segoe UI",
                sans-serif;
              fill: #102c3a;
            }
            .column-meta {
              font-size: 7px;
              fill: #617178;
            }
            .lane-label {
              font-size: 7px;
              font-weight: 500;
              letter-spacing: 0.08em;
              fill: #617178;
            }
            .card-title {
              font:
                600 10px "Space Grotesk",
                "Segoe UI",
                sans-serif;
              fill: #102c3a;
            }
            .card-sub {
              font:
                400 7px "Geist Mono",
                ui-monospace,
                monospace;
              fill: #617178;
            }
            .card-type {
              font-size: 6px;
              font-weight: 600;
              fill: #075d5b;
            }
            .legend-key {
              font-size: 8px;
              font-weight: 500;
              letter-spacing: 0.1em;
              fill: #617178;
            }
            .legend-text {
              font:
                400 9px "Space Grotesk",
                "Segoe UI",
                sans-serif;
              fill: #617178;
            }
            .board {
              fill: #fcfbf7;
              stroke: rgba(16, 44, 58, 0.18);
            }
            .column {
              fill: rgba(16, 44, 58, 0.018);
              stroke: none;
            }
            .card {
              fill: #fff;
              stroke: rgba(16, 44, 58, 0.28);
            }
            .card-expedite {
              fill: #f7ebe3;
              stroke: #b4653c;
              stroke-dasharray: 4 4;
            }
            .card-waiting {
              fill: rgba(16, 44, 58, 0.02);
              stroke: rgba(16, 44, 58, 0.28);
              stroke-dasharray: 4 3;
            }
            .card-done {
              fill: rgba(16, 44, 58, 0.05);
              stroke: #617178;
            }
            .rule {
              stroke: rgba(16, 44, 58, 0.14);
              stroke-width: 0.8;
            }
          </style>
        </defs>

        <rect width="1280" height="720" fill="#f5f3ed" />
        <rect width="1280" height="720" fill="url(#ops-dots)" opacity=".45" />
        <text class="eyebrow" x="40" y="30">
          OPERATIONS &amp; MAINTENANCE PROCESS · KANBANFLOW · MF-18 · WP-31
        </text>
        <text class="title" x="40" y="68">Continuous Kanban service delivery</text>
        <text class="subtitle" x="40" y="94">
          Production, maintenance and improvement demand is visible, selected at replenishment, and
          pulled only within WIP controls.
        </text>

        <rect class="board" x="116" y="128" width="1044" height="396" rx="8" />
        <rect class="column" x="220" y="128" width="188" height="396" />
        <rect class="column" x="408" y="128" width="188" height="396" />
        <rect class="column" x="596" y="128" width="188" height="396" />
        <rect class="column" x="784" y="128" width="188" height="396" />
        <rect class="column" x="972" y="128" width="188" height="396" />

        <g>
          <text class="column-name" x="232" y="154">Requested</text>
          <text class="column-meta" x="232" y="169">INTAKE + TRIAGE</text>
          <rect x="374" y="142" width="22" height="14" rx="2" fill="none" stroke="#617178" />
          <text class="column-meta" x="385" y="152" text-anchor="middle">1</text>
          <text class="column-name" x="420" y="154">Ready</text>
          <text class="column-meta" x="420" y="169">REPLENISHMENT</text>
          <rect x="554" y="142" width="30" height="14" rx="2" fill="none" stroke="#617178" />
          <text class="column-meta" x="569" y="152" text-anchor="middle">2/4</text>
          <text class="column-name" x="608" y="154">In Progress</text>
          <text class="column-meta" x="608" y="169">STARTED</text>
          <rect x="742" y="142" width="30" height="14" rx="2" fill="none" stroke="#617178" />
          <text class="column-meta" x="757" y="152" text-anchor="middle">2/3</text>
          <text class="column-name" x="796" y="154">Verify</text>
          <text class="column-meta" x="796" y="169">EVIDENCE</text>
          <rect x="930" y="142" width="30" height="14" rx="2" fill="none" stroke="#617178" />
          <text class="column-meta" x="945" y="152" text-anchor="middle">1/2</text>
          <text class="column-name" x="984" y="154">Done</text>
          <text class="column-meta" x="984" y="169">FINISHED · ARCHIVE</text>
          <rect x="1126" y="142" width="22" height="14" rx="2" fill="none" stroke="#617178" />
          <text class="column-meta" x="1137" y="152" text-anchor="middle">1</text>
        </g>

        <line class="rule" x1="116" y1="188" x2="1160" y2="188" />
        <line class="rule" x1="116" y1="272" x2="1160" y2="272" />
        <line class="rule" x1="116" y1="356" x2="1160" y2="356" />
        <line class="rule" x1="116" y1="440" x2="1160" y2="440" />
        <g class="lane-label" text-anchor="middle">
          <text x="168" y="230">EXPEDITE</text>
          <text x="168" y="314">FIXED DATE</text>
          <text x="168" y="398">STANDARD</text>
          <text x="168" y="482">RISK REDUCTION</text>
        </g>

        <g>
          <rect class="card-expedite" x="612" y="200" width="156" height="58" rx="6" />
          <rect x="612" y="200" width="4" height="58" rx="2" fill="#b4653c" />
          <text class="card-type" x="624" y="215">INCIDENT · AGE 14m</text>
          <text class="card-title" x="624" y="233">Restore checkout</text>
          <text class="card-sub" x="624" y="248">temporary fix tracked · owner SRE</text>
          <rect class="card-waiting" x="424" y="284" width="156" height="58" rx="6" />
          <text class="card-type" x="436" y="299">ADAPTIVE · DUE 08 OCT</text>
          <text class="card-title" x="436" y="317">Provider runtime update</text>
          <text class="card-sub" x="436" y="332">ready policy met · PSM route</text>
          <rect class="card" x="236" y="368" width="156" height="58" rx="6" />
          <text class="card-type" x="248" y="383">PERFECTIVE · REQUESTED</text>
          <text class="card-title" x="248" y="401">Reduce report latency</text>
          <text class="card-sub" x="248" y="416">needs evidence + disposition</text>
          <rect class="card" x="612" y="368" width="156" height="58" rx="6" />
          <text class="card-type" x="624" y="383">CORRECTIVE · AGE 2d</text>
          <text class="card-title" x="624" y="401">Repair retry policy</text>
          <text class="card-sub" x="624" y="416">PIM → PSM · bounded change</text>
          <rect class="card" x="800" y="368" width="156" height="58" rx="6" />
          <text class="card-type" x="812" y="383">STANDARD · VERIFY</text>
          <text class="card-title" x="812" y="401">Rotate signing key</text>
          <text class="card-sub" x="812" y="416">trace · rollback · evidence</text>
          <rect class="card-done" x="988" y="368" width="156" height="58" rx="6" />
          <text class="card-type" x="1000" y="383">OPERATIONS ONLY · DONE</text>
          <text class="card-title" x="1000" y="401">Re-drive dead letters</text>
          <text class="card-sub" x="1000" y="416">runbook evidence retained</text>
          <rect class="card" x="424" y="452" width="156" height="58" rx="6" />
          <text class="card-type" x="436" y="467">PREVENTIVE · READY</text>
          <text class="card-title" x="436" y="485">Raise quota headroom</text>
          <text class="card-sub" x="436" y="500">selected at replenishment</text>
        </g>

        <g>
          <rect x="116" y="552" width="304" height="96" rx="6" fill="#fcfbf7" stroke="#ccd2cf" />
          <text class="legend-key" x="132" y="576">DEFINITION OF WORKFLOW</text>
          <text class="legend-text" x="132" y="597">
            Explicit states · start/finish · WIP · policies · SLE
          </text>
          <text class="legend-text" x="132" y="617">
            Daily flow review · replenishment · service review
          </text>
          <text class="legend-text" x="132" y="637">
            WIP · throughput · cycle time · work-item age
          </text>
          <rect
            x="436"
            y="552"
            width="304"
            height="96"
            rx="6"
            fill="rgba(8,123,120,.08)"
            stroke="#087b78"
          />
          <text class="legend-key" x="452" y="576" fill="#075d5b">THREE ACCEPTED DISPOSITIONS</text>
          <text class="legend-text" x="452" y="597">
            1 · Operations-only resolution with evidence
          </text>
          <text class="legend-text" x="452" y="617">
            2 · Shortest safe MDE path + release controls
          </text>
          <text class="legend-text" x="452" y="637">
            3 · Deliberate commitment to a planned release
          </text>
          <rect x="756" y="552" width="404" height="96" rx="6" fill="#fcfbf7" stroke="#ccd2cf" />
          <text class="legend-key" x="772" y="576">LIFECYCLE BRIDGE</text>
          <text class="legend-text" x="772" y="597">
            The accepted baseline stays live while planned releases proceed.
          </text>
          <text class="legend-text" x="772" y="617">
            Expedite is an exceptional visible policy, not a second lifecycle.
          </text>
          <text class="legend-text" x="772" y="637">
            Temporary fixes remain open until removed or reconciled.
          </text>
        </g>

        <line class="rule" x1="40" y1="680" x2="1240" y2="680" />
        <text class="legend-key" x="40" y="704">BASIS</text>
        <text class="legend-text" x="96" y="704">
          Kanban Guide 2025 · PMI Disciplined Agile Lean/flow · Ahmad et al. 2018 · ISO/IEC/IEEE
          14764:2022
        </text>
        <text class="legend-key" x="1240" y="704" text-anchor="end">MR-LC-08…10 · MR-MG-08</text>
      </svg>
    </main>
  </body>
</html>
