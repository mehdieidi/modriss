# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
#
# Local hooks only — no download from GitHub on first commit (avoids hangs on slow networks).

default_install_hook_types:
  - pre-commit

repos:
  - repo: local
    hooks:
      - id: format-check
        name: format check
        entry: python scripts/format.py --check
        language: system
        pass_filenames: false
