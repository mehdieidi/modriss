name: modless

# Run from the repository root so Compose can substitute ${VAR} from ./.env:
#   docker compose up --build
#
# After changing files under mde/ (transformations, validation, metamodels), rebuild the backend
# image so /app/mde inside the container picks up the changes:
#   docker compose up --build --force-recreate backend
#
# The backend exposes modeling config via GET /api/modeling/config → diagramEditor.
# After changing renderer settings, recreate the backend container:
#   docker compose up --build --force-recreate backend
# The backend loads ../.env via env_file and only overrides container-specific
# settings in deploy/compose.yaml (database host, upload path, CORS origins).
# After changing secrets or AI settings, recreate the backend container:
#   docker compose up --build --force-recreate backend

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-modless}
      POSTGRES_USER: ${POSTGRES_USER:-modless}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-modless}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - modless-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      # Container-specific overrides only (take precedence over env_file).
      # All other MODLESS_* / provider settings come from ../.env via env_file.
      MODLESS_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-modless}
      MODLESS_DB_USER: ${POSTGRES_USER:-modless}
      MODLESS_DB_PASSWORD: ${POSTGRES_PASSWORD:-modless}
      MODLESS_UPLOAD_ROOT: ${MODLESS_CONTAINER_UPLOAD_ROOT:-/app/uploads}
      MODLESS_ALLOWED_ORIGINS: ${MODLESS_ALLOWED_ORIGINS:-http://127.0.0.1:5500,http://localhost:5500,http://127.0.0.1:${BACKEND_PORT:-8080},http://localhost:${BACKEND_PORT:-8080},http://127.0.0.1:${FRONTEND_PORT:-8082},http://localhost:${FRONTEND_PORT:-8082},http://127.0.0.1:${LANDING_PORT:-8083},http://localhost:${LANDING_PORT:-8083}}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - modless-backend-uploads:/app/uploads
      - modless-backend-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - freellmapi
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    image: python:3.13-alpine
    env_file:
      - path: ../.env
        required: false
    command:
      - sh
      - -c
      - |
        cp -a /app/. /srv/
        printf '%s\n' "window.MODLESS_BACKEND_BASE_URL = \"http://127.0.0.1:${BACKEND_PORT:-8080}\";" > /srv/backend-config.js
        exec python3 -m http.server --bind 0.0.0.0 8082 --directory /srv
    ports:
      - "${FRONTEND_PORT:-8082}:8082"
    volumes:
      - ../apps/frontend:/app:ro
    restart: unless-stopped

  localstack:
    image: localstack/localstack:latest
    env_file:
      - path: ../.env
        required: false
    environment:
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      DEBUG: ${LOCALSTACK_DEBUG:-0}
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      # Clean state is the reliable default for repeatable full-stack deployment tests.
      # Set LOCALSTACK_PERSISTENCE=1 when retained simulator state is more important.
      PERSISTENCE: ${LOCALSTACK_PERSISTENCE:-0}
      CFN_IGNORE_UNSUPPORTED_RESOURCE_TYPES: ${LOCALSTACK_CFN_IGNORE_UNSUPPORTED_RESOURCE_TYPES:-1}
      HTTP_PROXY: ${LOCALSTACK_HTTP_PROXY:-}
      HTTPS_PROXY: ${LOCALSTACK_HTTPS_PROXY:-}
      NO_PROXY: ${LOCALSTACK_NO_PROXY:-localhost,127.0.0.1,localstack}
    ports:
      - "${LOCALSTACK_GATEWAY_PORT:-4566}:4566"
      - "4510-4559:4510-4559"
    volumes:
      - modless-localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  landing:
    image: python:3.13-alpine
    command: ["python3", "-m", "http.server", "--bind", "0.0.0.0", "8083", "--directory", "/app"]
    ports:
      - "${LANDING_PORT:-8083}:8083"
    volumes:
      - ../apps/landing:/app:ro
    restart: unless-stopped

  dozzle:
    image: amir20/dozzle:latest
    ports:
      - "9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  modless-backend-logs:
  modless-backend-uploads:
  modless-localstack-data:
  modless-postgres-data:

networks:
  freellmapi:
    external: true
    name: ${FREELLMAPI_NETWORK:-freellmapi_default}
