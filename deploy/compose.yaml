name: modless

# Run from the repository root so Compose can substitute ${VAR} from ./.env:
#   docker compose up --build
#
# Diagram editor (canvas renderer):
#   MODLESS_DIAGRAM_RENDERER=antv-g6          # legacy AntV G6 canvas
#   MODLESS_DIAGRAM_RENDERER=glsp-sprotty     # Eclipse GLSP + Sprotty (default)
#   MODLESS_GLSP_SERVER_URL=ws://127.0.0.1:8081/modless   # browser WebSocket URL (host-published port)
#
# After changing files under mde/ (transformations, validation, metamodels), rebuild the backend
# image so /app/mde inside the container picks up the changes:
#   docker compose up --build --force-recreate backend
#
# The backend exposes these via GET /api/modeling/config → diagramEditor. After changing renderer
# settings, recreate the backend container:
#   docker compose up --build --force-recreate backend
# The backend also loads ../.env directly (see backend.env_file) so AI credentials
# update when you edit .env without relying on the shell or working directory.
# After changing secrets, recreate the backend container:
#   docker compose up --build --force-recreate backend

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-modless}
      POSTGRES_USER: ${POSTGRES_USER:-modless}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-modless}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - modless-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      # Container-specific overrides (take precedence over env_file).
      MODLESS_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-modless}
      MODLESS_DB_USER: ${POSTGRES_USER:-modless}
      MODLESS_DB_PASSWORD: ${POSTGRES_PASSWORD:-modless}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      MODLESS_DIAGRAM_RENDERER: ${MODLESS_DIAGRAM_RENDERER:-glsp-sprotty}
      MODLESS_GLSP_SERVER_URL: ${MODLESS_GLSP_SERVER_URL:-ws://127.0.0.1:8081/modless}
      MODLESS_UPLOAD_ROOT: ${MODLESS_UPLOAD_ROOT:-/app/uploads}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - modless-backend-uploads:/app/uploads
      - modless-backend-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    image: python:3.13-alpine
    command: ["python3", "-m", "http.server", "--bind", "0.0.0.0", "8082", "--directory", "/app"]
    ports:
      - "${FRONTEND_PORT:-8082}:8082"
    volumes:
      - ../apps/frontend:/app:ro
    restart: unless-stopped

  glsp-server:
    build:
      context: ..
      dockerfile: packages/js/glsp-server/Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      MODLESS_BACKEND_URL: http://backend:8080
      MODLESS_GLSP_HOST: 0.0.0.0
      MODLESS_GLSP_PORT: 8081
      MODLESS_GLSP_PATH: modless
      MODLESS_GLSP_LOG_LEVEL: ${MODLESS_GLSP_LOG_LEVEL:-info}
    ports:
      - "${GLSP_PORT:-8081}:8081"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8081/').then((r)=>process.exit(r.status===426?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  localstack:
    image: localstack/localstack:latest
    env_file:
      - path: ../.env
        required: false
    environment:
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      DEBUG: ${LOCALSTACK_DEBUG:-0}
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      # Clean state is the reliable default for repeatable full-stack deployment tests.
      # Set LOCALSTACK_PERSISTENCE=1 when retained simulator state is more important.
      PERSISTENCE: ${LOCALSTACK_PERSISTENCE:-0}
      CFN_IGNORE_UNSUPPORTED_RESOURCE_TYPES: ${LOCALSTACK_CFN_IGNORE_UNSUPPORTED_RESOURCE_TYPES:-1}
      HTTP_PROXY: ${LOCALSTACK_HTTP_PROXY:-http://host.docker.internal:2081}
      HTTPS_PROXY: ${LOCALSTACK_HTTPS_PROXY:-http://host.docker.internal:2081}
      NO_PROXY: ${LOCALSTACK_NO_PROXY:-localhost,127.0.0.1,localstack}
    ports:
      - "${LOCALSTACK_GATEWAY_PORT:-4566}:4566"
      - "4510-4559:4510-4559"
    volumes:
      - modless-localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  landing:
    image: python:3.13-alpine
    command: ["python3", "-m", "http.server", "--bind", "0.0.0.0", "8083", "--directory", "/app"]
    ports:
      - "${LANDING_PORT:-8083}:8083"
    volumes:
      - ../apps/landing:/app:ro
    restart: unless-stopped

  dozzle:
    image: amir20/dozzle:latest
    ports:
      - "9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  modless-backend-logs:
  modless-backend-uploads:
  modless-localstack-data:
  modless-postgres-data:
