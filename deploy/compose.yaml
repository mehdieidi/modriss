name: varka

# Run from the repository root so Compose can substitute ${VAR} from ./.env:
#   docker compose up --build
#
# After changing files under mde/ (transformations, validation, metamodels), rebuild the backend
# image so /app/mde inside the container picks up the changes:
#   docker compose up --build --force-recreate backend
#
# The backend exposes modeling config via GET /api/modeling/config → diagramEditor.
# After changing renderer settings, recreate the backend container:
#   docker compose up --build --force-recreate backend
# The backend loads ../.env via env_file and only overrides container-specific
# settings in deploy/compose.yaml (database host, upload path, CORS origins).
# After changing secrets or AI settings, recreate the backend container:
#   docker compose up --build --force-recreate backend

services:
  caddy:
    image: caddy:2.8-alpine
    ports:
      - "${CADDY_HTTP_PORT:-8088}:8088"
    volumes:
      - ../infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - varka-caddy-logs:/var/log/caddy
      - varka-caddy-data:/data
      - varka-caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
      admin:
        condition: service_started
      landing:
        condition: service_started
      grafana:
        condition: service_started
      prometheus:
        condition: service_started
      dozzle:
        condition: service_started
      loki:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-varka}
      POSTGRES_USER: ${POSTGRES_USER:-varka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-varka}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - varka-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      # Container-specific overrides only (take precedence over env_file).
      # All other VARKA_* / provider settings come from ../.env via env_file.
      VARKA_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-varka}
      VARKA_DB_USER: ${POSTGRES_USER:-varka}
      VARKA_DB_PASSWORD: ${POSTGRES_PASSWORD:-varka}
      VARKA_UPLOAD_ROOT: ${VARKA_CONTAINER_UPLOAD_ROOT:-/app/uploads}
      VARKA_ALLOWED_ORIGINS: ${VARKA_ALLOWED_ORIGINS:-http://127.0.0.1:5500,http://localhost:5500,http://127.0.0.1:${BACKEND_PORT:-8080},http://localhost:${BACKEND_PORT:-8080},http://127.0.0.1:${FRONTEND_PORT:-8082},http://localhost:${FRONTEND_PORT:-8082},http://127.0.0.1:${LANDING_PORT:-8083},http://localhost:${LANDING_PORT:-8083},http://127.0.0.1:${ADMIN_PORT:-8084},http://localhost:${ADMIN_PORT:-8084},http://localhost:${CADDY_HTTP_PORT:-8088},http://127.0.0.1:${CADDY_HTTP_PORT:-8088},http://admin.localhost:${CADDY_HTTP_PORT:-8088},http://api.localhost:${CADDY_HTTP_PORT:-8088},http://editor.localhost:${CADDY_HTTP_PORT:-8088}}
      LOGGING_FILE_NAME: /app/logs/backend.log
      # The OpenAI Java SDK also checks OPENAI_API_KEY internally. Keep the app-level
      # OpenAI-compatible key as the source of truth while satisfying that SDK path.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-${OPENAI_COMPATIBLE_API_KEY:-}}
      # Bind the application property directly as well. This keeps provider availability checks
      # aligned with the SDK credential when an OpenAI-compatible endpoint is selected.
      VARKA_AI_OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - varka-backend-uploads:/app/uploads
      - varka-backend-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - freellmapi
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    image: python:3.13-alpine
    env_file:
      - path: ../.env
        required: false
    command:
      - sh
      - -c
      - |
        cp -a /app/. /srv/
        printf '%s\n' "window.VARKA_BACKEND_BASE_URL = \"http://127.0.0.1:${BACKEND_PORT:-8080}\";" > /srv/backend-config.js
        exec python3 -m http.server --bind 0.0.0.0 8082 --directory /srv
    ports:
      - "${FRONTEND_PORT:-8082}:8082"
    volumes:
      - ../apps/frontend:/app:ro
    restart: unless-stopped

  admin:
    build:
      context: ../apps/admin
      dockerfile: Dockerfile
    command:
      - sh
      - -c
      - |
        printf '%s\n' "window.VARKA_ADMIN_BACKEND_BASE_URL = \"http://admin.localhost:${CADDY_HTTP_PORT:-8088}\";" \
          > /usr/share/nginx/html/admin-config.js
        exec nginx -g 'daemon off;'
    ports:
      - "${ADMIN_PORT:-8084}:8084"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  localstack:
    image: localstack/localstack:latest
    env_file:
      - path: ../.env
        required: false
    environment:
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      DEBUG: ${LOCALSTACK_DEBUG:-0}
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      # Clean state is the reliable default for repeatable full-stack deployment tests.
      # Set LOCALSTACK_PERSISTENCE=1 when retained simulator state is more important.
      PERSISTENCE: ${LOCALSTACK_PERSISTENCE:-0}
      CFN_IGNORE_UNSUPPORTED_RESOURCE_TYPES: ${LOCALSTACK_CFN_IGNORE_UNSUPPORTED_RESOURCE_TYPES:-1}
      HTTP_PROXY: ${LOCALSTACK_HTTP_PROXY:-}
      HTTPS_PROXY: ${LOCALSTACK_HTTPS_PROXY:-}
      NO_PROXY: ${LOCALSTACK_NO_PROXY:-localhost,127.0.0.1,localstack}
    ports:
      - "${LOCALSTACK_GATEWAY_PORT:-4566}:4566"
      - "4510-4559:4510-4559"
    volumes:
      - varka-localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  landing:
    build:
      context: ../apps/landing
      args:
        VITE_BACKEND_BASE_URL: http://localhost:${CADDY_HTTP_PORT:-8088}
    ports:
      - "${LANDING_PORT:-8083}:8083"
    restart: unless-stopped

  dozzle:
    image: amir20/dozzle:latest
    ports:
      - "9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ../infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../infra/prometheus/varka-alerts.yml:/etc/prometheus/rules/varka-alerts.yml:ro
      - varka-prometheus-data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
      postgres-exporter:
        condition: service_started
      node-exporter:
        condition: service_started
      cadvisor:
        condition: service_started
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-varka}:${POSTGRES_PASSWORD:-varka}@postgres:5432/${POSTGRES_DB:-varka}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.2
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/loki.yml"]
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ../infra/loki/loki.yml:/etc/loki/loki.yml:ro
      - varka-loki-data:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.3.2
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ../infra/loki/promtail.yml:/etc/promtail/promtail.yml:ro
      - varka-backend-logs:/var/log/varka:ro
      - varka-caddy-logs:/var/log/caddy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_METRICS_ENABLED: "true"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ../infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../infra/grafana:/var/lib/grafana/dashboards:ro
      - varka-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

volumes:
  varka-caddy-config:
  varka-caddy-data:
  varka-caddy-logs:
  varka-backend-logs:
  varka-backend-uploads:
  varka-grafana-data:
  varka-loki-data:
  varka-localstack-data:
  varka-prometheus-data:
  varka-postgres-data:

networks:
  freellmapi:
    external: true
    name: ${FREELLMAPI_NETWORK:-freellmapi_default}
