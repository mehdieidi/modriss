name: modless

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-modless}
      POSTGRES_USER: ${POSTGRES_USER:-modless}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-modless}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - modless-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      MODLESS_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-modless}
      MODLESS_DB_USER: ${POSTGRES_USER:-modless}
      MODLESS_DB_PASSWORD: ${POSTGRES_PASSWORD:-modless}
      SPRING_PROFILES_ACTIVE: prod
      MODLESS_AI_ENABLED: ${MODLESS_AI_ENABLED:-true}
      MODLESS_AI_MODE: ${MODLESS_AI_MODE:-GUARDED_APPLY}
      MODLESS_AI_PROVIDER: ${MODLESS_AI_PROVIDER:-openai}
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-http://host.docker.internal:3001}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      MODLESS_AI_PLANNER_MODEL: ${MODLESS_AI_PLANNER_MODEL:-auto}
      MODLESS_AI_RESPONDER_MODEL: ${MODLESS_AI_RESPONDER_MODEL:-auto}
      MODLESS_AI_SUMMARIZER_MODEL: ${MODLESS_AI_SUMMARIZER_MODEL:-auto}
      MODLESS_AI_REQUEST_TIMEOUT: ${MODLESS_AI_REQUEST_TIMEOUT:-5m}
      MODLESS_AI_MAX_TOOL_CALLS: ${MODLESS_AI_MAX_TOOL_CALLS:-96}
      MODLESS_AI_VALIDATION_REPAIR_ATTEMPTS: ${MODLESS_AI_VALIDATION_REPAIR_ATTEMPTS:-6}
      MODLESS_AI_PROVIDER_RETRY_ATTEMPTS: ${MODLESS_AI_PROVIDER_RETRY_ATTEMPTS:-2}
      MODLESS_AI_PROXY_ENABLED: ${MODLESS_AI_PROXY_ENABLED:-false}
      MODLESS_AI_PROXY_TYPE: ${MODLESS_AI_PROXY_TYPE:-HTTP}
      MODLESS_AI_PROXY_HOST: ${MODLESS_AI_PROXY_HOST:-host.docker.internal}
      MODLESS_AI_PROXY_PORT: ${MODLESS_AI_PROXY_PORT:-2081}
      MODLESS_AI_EMBEDDINGS_PROVIDER: ${MODLESS_AI_EMBEDDINGS_PROVIDER:-ONNX}
      MODLESS_AI_EMBEDDINGS_FALLBACK_TO_HASH: ${MODLESS_AI_EMBEDDINGS_FALLBACK_TO_HASH:-true}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    image: python:3.13-alpine
    command: ["python3", "-m", "http.server", "--bind", "0.0.0.0", "8082", "--directory", "/app"]
    ports:
      - "${FRONTEND_PORT:-8082}:8082"
    volumes:
      - ../apps/frontend:/app:ro
    restart: unless-stopped

  localstack:
    image: localstack/localstack:latest
    environment:
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      DEBUG: ${LOCALSTACK_DEBUG:-0}
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      # Clean state is the reliable default for repeatable full-stack deployment tests.
      # Set LOCALSTACK_PERSISTENCE=1 when retained simulator state is more important.
      PERSISTENCE: ${LOCALSTACK_PERSISTENCE:-0}
      CFN_IGNORE_UNSUPPORTED_RESOURCE_TYPES: ${LOCALSTACK_CFN_IGNORE_UNSUPPORTED_RESOURCE_TYPES:-1}
      HTTP_PROXY: ${LOCALSTACK_HTTP_PROXY:-http://host.docker.internal:2081}
      HTTPS_PROXY: ${LOCALSTACK_HTTPS_PROXY:-http://host.docker.internal:2081}
      NO_PROXY: ${LOCALSTACK_NO_PROXY:-localhost,127.0.0.1,localstack}
    ports:
      - "${LOCALSTACK_GATEWAY_PORT:-4566}:4566"
      - "4510-4559:4510-4559"
    volumes:
      - modless-localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  landing:
    image: python:3.13-alpine
    command: ["python3", "-m", "http.server", "--bind", "0.0.0.0", "8083", "--directory", "/app"]
    ports:
      - "${LANDING_PORT:-8083}:8083"
    volumes:
      - ../apps/landing:/app:ro
    restart: unless-stopped

  dozzle:
    image: amir20/dozzle:latest
    ports:
      - "9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  modless-localstack-data:
  modless-postgres-data:
