services:
  caddy:
    depends_on:
      dozzle:
        condition: service_started
    command:
      - caddy
      - run
      - --config
      - /etc/caddy/Caddyfile.dev
      - --adapter
      - caddyfile
    ports:
      - "${MODRISS_DEV_BIND_ADDRESS:-127.0.0.1}:${CADDY_HTTP_PORT:-8088}:8088"
    volumes:
      # Mount the directory instead of a single file. Docker Desktop can create a
      # missing file bind source as a directory, which makes Caddy fail with a
      # file/directory mount error before it can serve requests.
      - ../infra/caddy:/etc/caddy:ro

  backend:
    environment:
      MODRISS_EDITOR_URL: ${MODRISS_EDITOR_URL:-http://editor.localhost:8088}
      MODRISS_ALLOWED_ORIGINS: ${MODRISS_ALLOWED_ORIGINS:-http://127.0.0.1:5500,http://localhost:5500,http://127.0.0.1:8080,http://localhost:8080,http://127.0.0.1:8082,http://localhost:8082,http://127.0.0.1:8083,http://localhost:8083,http://127.0.0.1:8084,http://localhost:8084,http://localhost:8088,http://127.0.0.1:8088,http://admin.localhost:8088,http://api.localhost:8088,http://editor.localhost:8088}
    ports:
      - "${MODRISS_DEV_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8080}:8080"

  frontend:
    build: !reset null
    image: python:3.13-alpine
    command:
      - sh
      - -c
      - |
        cp -a /app/. /srv/
        printf '%s\n' "window.MODRISS_BACKEND_BASE_URL = \"$${MODRISS_FRONTEND_BACKEND_BASE_URL}\";" > /srv/backend-config.js
        printf '%s\n' "window.MODRISS_DOCS_URL = \"$${MODRISS_FRONTEND_DOCS_URL}\";" >> /srv/backend-config.js
        exec python3 -m http.server --bind 0.0.0.0 8082 --directory /srv
    volumes:
      - ../apps/frontend:/app:ro
    restart: unless-stopped
    environment:
      MODRISS_FRONTEND_BACKEND_BASE_URL: ${MODRISS_FRONTEND_BACKEND_BASE_URL:-http://api.localhost:8088}
      MODRISS_FRONTEND_DOCS_URL: ${MODRISS_DOCS_URL:-http://docs.localhost:8088}
    ports:
      - "${MODRISS_DEV_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8082}:8082"

  admin:
    environment:
      MODRISS_ADMIN_BACKEND_BASE_URL: ${MODRISS_ADMIN_URL:-http://admin.localhost:8088}
    ports:
      - "${MODRISS_DEV_BIND_ADDRESS:-127.0.0.1}:${ADMIN_PORT:-8084}:8084"

  landing:
    build:
      args:
        VITE_BACKEND_BASE_URL: ${MODRISS_PUBLIC_URL:-http://localhost:8088}
        VITE_APP_URL: ${MODRISS_EDITOR_URL:-http://editor.localhost:8088}
        VITE_DOCS_URL: ${MODRISS_DOCS_URL:-http://docs.localhost:8088}
    ports:
      - "${MODRISS_DEV_BIND_ADDRESS:-127.0.0.1}:${LANDING_PORT:-8083}:8083"

  postgres:
    ports:
      - "${MODRISS_DEV_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"

  localstack:
    ports:
      - "${MODRISS_DEV_BIND_ADDRESS:-127.0.0.1}:${LOCALSTACK_GATEWAY_PORT:-4566}:4566"
      - "${MODRISS_DEV_BIND_ADDRESS:-127.0.0.1}:4510-4559:4510-4559"

  floci:
    ports:
      - "${MODRISS_DEV_BIND_ADDRESS:-127.0.0.1}:${AWS_EMULATOR_GATEWAY_PORT:-4566}:4566"

  dozzle:
    image: ${DOZZLE_IMAGE:-amir20/dozzle:v10.8.0}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    ports:
      - "${MODRISS_DEV_BIND_ADDRESS:-127.0.0.1}:9999:8080"

  prometheus:
    ports:
      - "${MODRISS_DEV_BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"

  loki:
    ports:
      - "${MODRISS_DEV_BIND_ADDRESS:-127.0.0.1}:${LOKI_PORT:-3100}:3100"

  grafana:
    ports:
      - "${MODRISS_DEV_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
