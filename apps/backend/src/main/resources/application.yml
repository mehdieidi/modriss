server:
  port: 8080
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types:
      - application/json
      - application/*+json
      - text/plain
    min-response-size: 1024

spring:
  application:
    name: modriss-backend
  ai:
    # The local transformer implementation is packaged, but stays disabled until the deployment
    # supplies a verified, cached ONNX model/tokenizer. Lexical retrieval is always available.
    model:
      embedding: ${MODRISS_AI_EMBEDDING_PROVIDER:none}
  # Compose injects .env explicitly. These optional imports give the same configuration to a
  # backend started from the repository root or apps/backend in a WSL terminal.
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../../.env[.properties]
  datasource:
    url: ${MODRISS_DB_URL:jdbc:postgresql://localhost:5432/modriss}
    username: ${MODRISS_DB_USER:modriss}
    password: ${MODRISS_DB_PASSWORD:modriss}
    hikari:
      maximum-pool-size: ${MODRISS_DB_MAX_POOL_SIZE:10}
      minimum-idle: ${MODRISS_DB_MIN_IDLE:2}
      connection-timeout: 30000
      validation-timeout: 5000
  flyway:
    enabled: true
    ignore-migration-patterns: "*:missing"
    locations:
      - classpath:db/migration
      - classpath:db/assistant-migration
    validate-migration-naming: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

modriss:
  session-ttl: 30d
  guest:
    prompt-limit: ${MODRISS_GUEST_PROMPT_LIMIT:5}
  admin:
    bootstrap-enabled: ${MODRISS_ADMIN_BOOTSTRAP_ENABLED:false}
    bootstrap-emails: ${MODRISS_ADMIN_BOOTSTRAP_EMAILS:}
    bootstrap-token: ${MODRISS_ADMIN_BOOTSTRAP_TOKEN:}
  mde:
    execution-timeout: ${MODRISS_MDE_EXECUTION_TIMEOUT:5m}
    job-timeout: ${MODRISS_MDE_JOB_TIMEOUT:10m}
    max-captured-output-bytes: ${MODRISS_MDE_MAX_CAPTURED_OUTPUT_BYTES:1048576}
    max-concurrent-jobs: ${MODRISS_MDE_MAX_CONCURRENT_JOBS:2}
    queue-capacity: ${MODRISS_MDE_QUEUE_CAPACITY:32}
    max-model-upload-bytes: ${MODRISS_MDE_MAX_MODEL_UPLOAD_BYTES:20971520}
    max-generated-files: ${MODRISS_MDE_MAX_GENERATED_FILES:2000}
    max-generated-file-bytes: ${MODRISS_MDE_MAX_GENERATED_FILE_BYTES:5242880}
    max-generated-artifact-bytes: ${MODRISS_MDE_MAX_GENERATED_ARTIFACT_BYTES:52428800}
    staged-import-ttl: ${MODRISS_MDE_STAGED_IMPORT_TTL:2h}
    import-cleanup-interval: ${MODRISS_MDE_IMPORT_CLEANUP_INTERVAL:PT15M}
  upload:
    root: ${MODRISS_UPLOAD_ROOT:uploads}
    max-file-bytes: ${MODRISS_UPLOAD_MAX_FILE_BYTES:1048576}
    max-text-chars: ${MODRISS_UPLOAD_MAX_TEXT_CHARS:120000}
  ai:
    enabled: ${MODRISS_AI_ENABLED:false}
    metamodel-mode: ${MODRISS_AI_METAMODEL_MODE:normal}
    mode: ${MODRISS_AI_MODE:unified}
    workflow-engine-v2: ${MODRISS_AI_WORKFLOW_ENGINE_V2:true}
    provider: ${MODRISS_AI_PROVIDER:openai}
    request-timeout: ${MODRISS_AI_REQUEST_TIMEOUT:30s}
    turn-timeout: ${MODRISS_AI_TURN_TIMEOUT:3m}
    max-tool-calls: ${MODRISS_AI_MAX_TOOL_CALLS:0}
    validation-repair-attempts: ${MODRISS_AI_VALIDATION_REPAIR_ATTEMPTS:1}
    max-repair-attempts: ${MODRISS_AI_MAX_REPAIR_ATTEMPTS:4}
    max-agent-steps: ${MODRISS_AI_MAX_AGENT_STEPS:8}
    max-tool-calls-per-step: ${MODRISS_AI_MAX_TOOL_CALLS_PER_STEP:8}
    token-budget: ${MODRISS_AI_TOKEN_BUDGET:16000}
    max-prompt-tokens: ${MODRISS_AI_MAX_PROMPT_TOKENS:24000}
    max-context-snippets: ${MODRISS_AI_MAX_CONTEXT_SNIPPETS:16}
    reserved-schema-snippets: ${MODRISS_AI_RESERVED_SCHEMA_SNIPPETS:10}
    max-snippet-chars: ${MODRISS_AI_MAX_SNIPPET_CHARS:1600}
    max-system-chars: ${MODRISS_AI_MAX_SYSTEM_CHARS:14000}
    max-source-chunk-tokens: ${MODRISS_AI_MAX_SOURCE_CHUNK_TOKENS:4000}
    max-source-chunks-per-turn: ${MODRISS_AI_MAX_SOURCE_CHUNKS_PER_TURN:24}
    max-provider-calls-per-turn: ${MODRISS_AI_MAX_PROVIDER_CALLS_PER_TURN:24}
    max-provider-calls-source-turn: ${MODRISS_AI_MAX_PROVIDER_CALLS_SOURCE_TURN:20}
    max-completion-tokens: ${MODRISS_AI_MAX_COMPLETION_TOKENS:6000}
    max-patch-creates: ${MODRISS_AI_MAX_PATCH_CREATES:48}
    max-patch-connections: ${MODRISS_AI_MAX_PATCH_CONNECTIONS:96}
    max-patch-evidence: ${MODRISS_AI_MAX_PATCH_EVIDENCE:64}
    max-contract-count: ${MODRISS_AI_MAX_CONTRACT_COUNT:12}
    native-tools-preferred: ${MODRISS_AI_NATIVE_TOOLS_PREFERRED:true}
    forced-tool-choice-reliable: ${MODRISS_AI_FORCED_TOOL_CHOICE_RELIABLE:true}
    llm-contract-rerank-enabled: ${MODRISS_AI_LLM_CONTRACT_RERANK_ENABLED:false}
    source-turn-timeout: ${MODRISS_AI_SOURCE_TURN_TIMEOUT:5m}
    max-cim-modeling-passes: ${MODRISS_AI_MAX_CIM_MODELING_PASSES:4}
    prefer-llm-source-extraction: ${MODRISS_AI_PREFER_LLM_SOURCE_EXTRACTION:true}
    llm-review-enabled: ${MODRISS_AI_LLM_REVIEW_ENABLED:true}
    automatic-continuation-enabled: ${MODRISS_AI_AUTOMATIC_CONTINUATION_ENABLED:true}
    require-idempotency-key: ${MODRISS_AI_REQUIRE_IDEMPOTENCY_KEY:true}
    fallback-provider: ${MODRISS_AI_FALLBACK_PROVIDER:}
    hardening:
      per-user-requests-per-window: ${MODRISS_AI_RATE_LIMIT_REQUESTS:30}
      rate-limit-window: ${MODRISS_AI_RATE_LIMIT_WINDOW:1m}
      circuit-failure-threshold: ${MODRISS_AI_CIRCUIT_FAILURE_THRESHOLD:3}
      circuit-open-duration: ${MODRISS_AI_CIRCUIT_OPEN_DURATION:1m}
      provider-retry-attempts: ${MODRISS_AI_PROVIDER_RETRY_ATTEMPTS:2}
      retry-backoff: ${MODRISS_AI_RETRY_BACKOFF:2s}
      recent-message-window: ${MODRISS_AI_RECENT_MESSAGE_WINDOW:24}
    proxy:
      enabled: ${MODRISS_AI_PROXY_ENABLED:false}
      type: ${MODRISS_AI_PROXY_TYPE:HTTP}
      host: ${MODRISS_AI_PROXY_HOST:127.0.0.1}
      port: ${MODRISS_AI_PROXY_PORT:2081}
      connect-timeout: ${MODRISS_AI_PROXY_CONNECT_TIMEOUT:2s}
    # Optional provider-specific proxy overrides. Omitted fields retain the global proxy settings.
    provider-proxies:
      openai:
        enabled: ${MODRISS_AI_OPENAI_PROXY_ENABLED:${MODRISS_AI_PROXY_ENABLED:false}}
        type: ${MODRISS_AI_OPENAI_PROXY_TYPE:${MODRISS_AI_PROXY_TYPE:HTTP}}
        host: ${MODRISS_AI_OPENAI_PROXY_HOST:${MODRISS_AI_PROXY_HOST:127.0.0.1}}
        port: ${MODRISS_AI_OPENAI_PROXY_PORT:${MODRISS_AI_PROXY_PORT:2081}}
        connect-timeout: ${MODRISS_AI_OPENAI_PROXY_CONNECT_TIMEOUT:${MODRISS_AI_PROXY_CONNECT_TIMEOUT:2s}}
      gemini:
        enabled: ${MODRISS_AI_GEMINI_PROXY_ENABLED:${MODRISS_AI_PROXY_ENABLED:false}}
        type: ${MODRISS_AI_GEMINI_PROXY_TYPE:${MODRISS_AI_PROXY_TYPE:HTTP}}
        host: ${MODRISS_AI_GEMINI_PROXY_HOST:${MODRISS_AI_PROXY_HOST:127.0.0.1}}
        port: ${MODRISS_AI_GEMINI_PROXY_PORT:${MODRISS_AI_PROXY_PORT:2081}}
        connect-timeout: ${MODRISS_AI_GEMINI_PROXY_CONNECT_TIMEOUT:${MODRISS_AI_PROXY_CONNECT_TIMEOUT:2s}}
    openai-compatible:
      base-url: ${OPENAI_COMPATIBLE_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_COMPATIBLE_API_KEY:}
      protocol: ${MODRISS_AI_OPENAI_PROTOCOL:tools}
    gemini:
      api-key: ${GEMINI_API_KEY:}
    models:
      model: ${MODRISS_AI_MODEL:}
      test-model: ${MODRISS_AI_TEST_MODEL:}
  allowed-origins:
    # Override entirely with comma-separated MODRISS_ALLOWED_ORIGINS from the Compose environment overlay.
    - http://127.0.0.1:5500
    - http://localhost:5500
    - http://127.0.0.1:8080
    - http://localhost:8080
    - http://localhost:8082
    - http://127.0.0.1:8082
    - http://127.0.0.1:8088
    - http://localhost:8088

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      enabled: ${MODRISS_METRICS_ENABLED:true}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  prometheus:
    metrics:
      export:
        enabled: ${MODRISS_METRICS_ENABLED:true}
  tracing:
    enabled: ${MODRISS_TRACING_ENABLED:false}
    sampling:
      probability: ${MODRISS_TRACING_SAMPLE_RATE:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} requestId=%X{requestId:-} %kvp - %msg%n%wEx"
    file: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} requestId=%X{requestId:-} %kvp - %msg%n%wEx"
  level:
    root: INFO
    io.mehdieidi.modriss: DEBUG
