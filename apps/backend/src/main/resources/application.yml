server:
  port: 8080
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types:
      - application/json
      - application/*+json
      - text/plain
    min-response-size: 1024

spring:
  application:
    name: modless-backend
  datasource:
    url: ${MODLESS_DB_URL:jdbc:postgresql://localhost:5432/modless}
    username: ${MODLESS_DB_USER:modless}
    password: ${MODLESS_DB_PASSWORD:modless}
    hikari:
      maximum-pool-size: ${MODLESS_DB_MAX_POOL_SIZE:10}
      minimum-idle: ${MODLESS_DB_MIN_IDLE:2}
      connection-timeout: 30000
      validation-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

modless:
  session-ttl: 30d
  mde:
    execution-timeout: ${MODLESS_MDE_EXECUTION_TIMEOUT:5m}
    job-timeout: ${MODLESS_MDE_JOB_TIMEOUT:10m}
    max-captured-output-bytes: ${MODLESS_MDE_MAX_CAPTURED_OUTPUT_BYTES:1048576}
    max-concurrent-jobs: ${MODLESS_MDE_MAX_CONCURRENT_JOBS:2}
    queue-capacity: ${MODLESS_MDE_QUEUE_CAPACITY:32}
    max-model-upload-bytes: ${MODLESS_MDE_MAX_MODEL_UPLOAD_BYTES:20971520}
    max-generated-files: ${MODLESS_MDE_MAX_GENERATED_FILES:2000}
    max-generated-file-bytes: ${MODLESS_MDE_MAX_GENERATED_FILE_BYTES:5242880}
    max-generated-artifact-bytes: ${MODLESS_MDE_MAX_GENERATED_ARTIFACT_BYTES:52428800}
    staged-import-ttl: ${MODLESS_MDE_STAGED_IMPORT_TTL:2h}
    import-cleanup-interval: ${MODLESS_MDE_IMPORT_CLEANUP_INTERVAL:PT15M}
  allowed-origins:
    - http://127.0.0.1:5500
    - http://localhost:5500
    - http://127.0.0.1:8080
    - http://localhost:8080
    - http://localhost:8082
    - http://127.0.0.1:8082

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: '%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} requestId=%X{requestId:-} - %msg%n%wEx'
    file: '%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} requestId=%X{requestId:-} - %msg%n%wEx'
  level:
    root: INFO
    io.mehdieidi.modless: DEBUG
