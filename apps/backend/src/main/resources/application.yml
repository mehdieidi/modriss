server:
  port: 8080
  compression:
    enabled: true
    mime-types:
      - application/json
      - application/*+json
      - text/plain
    min-response-size: 1024

spring:
  application:
    name: modless-backend
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

modless:
  storage-root: ${MODLESS_STORAGE_ROOT:storage}
  session-ttl: 30d
  allowed-origins:
    - http://127.0.0.1:5500
    - http://localhost:5500
    - http://127.0.0.1:8080
    - http://localhost:8080
    - http://localhost:8082
    - http://127.0.0.1:8082

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  file:
    name: logs/backend.log
  level:
    root: INFO
    io.mehdieidi.modless: DEBUG
