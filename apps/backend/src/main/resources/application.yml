server:
  port: 8080
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types:
      - application/json
      - application/*+json
      - text/plain
    min-response-size: 1024

spring:
  application:
    name: modless-backend
  datasource:
    url: ${MODLESS_DB_URL:jdbc:postgresql://localhost:5432/modless}
    username: ${MODLESS_DB_USER:modless}
    password: ${MODLESS_DB_PASSWORD:modless}
    hikari:
      maximum-pool-size: ${MODLESS_DB_MAX_POOL_SIZE:10}
      minimum-idle: ${MODLESS_DB_MIN_IDLE:2}
      connection-timeout: 30000
      validation-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

modless:
  session-ttl: 30d
  mde:
    execution-timeout: ${MODLESS_MDE_EXECUTION_TIMEOUT:5m}
    job-timeout: ${MODLESS_MDE_JOB_TIMEOUT:10m}
    max-captured-output-bytes: ${MODLESS_MDE_MAX_CAPTURED_OUTPUT_BYTES:1048576}
    max-concurrent-jobs: ${MODLESS_MDE_MAX_CONCURRENT_JOBS:2}
    queue-capacity: ${MODLESS_MDE_QUEUE_CAPACITY:32}
    max-model-upload-bytes: ${MODLESS_MDE_MAX_MODEL_UPLOAD_BYTES:20971520}
    max-generated-files: ${MODLESS_MDE_MAX_GENERATED_FILES:2000}
    max-generated-file-bytes: ${MODLESS_MDE_MAX_GENERATED_FILE_BYTES:5242880}
    max-generated-artifact-bytes: ${MODLESS_MDE_MAX_GENERATED_ARTIFACT_BYTES:52428800}
    staged-import-ttl: ${MODLESS_MDE_STAGED_IMPORT_TTL:2h}
    import-cleanup-interval: ${MODLESS_MDE_IMPORT_CLEANUP_INTERVAL:PT15M}
  upload:
    root: ${MODLESS_UPLOAD_ROOT:uploads}
    max-file-bytes: ${MODLESS_UPLOAD_MAX_FILE_BYTES:1048576}
    max-text-chars: ${MODLESS_UPLOAD_MAX_TEXT_CHARS:120000}
  ai:
    enabled: ${MODLESS_AI_ENABLED:false}
    mode: ${MODLESS_AI_MODE:AUTONOMOUS}
    provider: ${MODLESS_AI_PROVIDER:openai}
    request-timeout: ${MODLESS_AI_REQUEST_TIMEOUT:10m}
    max-tool-calls: ${MODLESS_AI_MAX_TOOL_CALLS:0}
    validation-repair-attempts: ${MODLESS_AI_VALIDATION_REPAIR_ATTEMPTS:6}
    max-agent-steps: ${MODLESS_AI_MAX_AGENT_STEPS:16}
    max-tool-calls-per-step: ${MODLESS_AI_MAX_TOOL_CALLS_PER_STEP:8}
    max-auto-apply-operations: ${MODLESS_AI_MAX_AUTO_APPLY_OPERATIONS:0}
    semantic-validation-enabled: ${MODLESS_AI_SEMANTIC_VALIDATION_ENABLED:false}
    token-budget: ${MODLESS_AI_TOKEN_BUDGET:16000}
    context-window-tokens: ${MODLESS_AI_CONTEXT_WINDOW_TOKENS:0}
    max-context-snippets: ${MODLESS_AI_MAX_CONTEXT_SNIPPETS:24}
    reserved-schema-snippets: ${MODLESS_AI_RESERVED_SCHEMA_SNIPPETS:10}
    max-snippet-chars: ${MODLESS_AI_MAX_SNIPPET_CHARS:2400}
    max-system-chars: ${MODLESS_AI_MAX_SYSTEM_CHARS:14000}
    fallback-provider: ${MODLESS_AI_FALLBACK_PROVIDER:}
    hardening:
      per-user-requests-per-window: ${MODLESS_AI_RATE_LIMIT_REQUESTS:30}
      rate-limit-window: ${MODLESS_AI_RATE_LIMIT_WINDOW:1m}
      circuit-failure-threshold: ${MODLESS_AI_CIRCUIT_FAILURE_THRESHOLD:3}
      circuit-open-duration: ${MODLESS_AI_CIRCUIT_OPEN_DURATION:1m}
      provider-retry-attempts: ${MODLESS_AI_PROVIDER_RETRY_ATTEMPTS:2}
      retry-backoff: ${MODLESS_AI_RETRY_BACKOFF:250ms}
      recent-message-window: ${MODLESS_AI_RECENT_MESSAGE_WINDOW:24}
    embeddings:
      provider: ${MODLESS_AI_EMBEDDINGS_PROVIDER:HASH}
      model-resource: ${MODLESS_AI_EMBEDDINGS_MODEL_RESOURCE:}
      tokenizer-resource: ${MODLESS_AI_EMBEDDINGS_TOKENIZER_RESOURCE:}
      model-output-name: ${MODLESS_AI_EMBEDDINGS_MODEL_OUTPUT_NAME:}
      cache-directory: ${MODLESS_AI_EMBEDDINGS_CACHE_DIRECTORY:}
      disable-caching: ${MODLESS_AI_EMBEDDINGS_DISABLE_CACHING:false}
      gpu-device-id: ${MODLESS_AI_EMBEDDINGS_GPU_DEVICE_ID:-1}
      fallback-to-hash: ${MODLESS_AI_EMBEDDINGS_FALLBACK_TO_HASH:true}
    proxy:
      enabled: ${MODLESS_AI_PROXY_ENABLED:false}
      type: ${MODLESS_AI_PROXY_TYPE:HTTP}
      host: ${MODLESS_AI_PROXY_HOST:127.0.0.1}
      port: ${MODLESS_AI_PROXY_PORT:2081}
      connect-timeout: ${MODLESS_AI_PROXY_CONNECT_TIMEOUT:2s}
    openai-compatible:
      base-url: ${OPENAI_COMPATIBLE_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_COMPATIBLE_API_KEY:${OPENAI_API_KEY:}}
    gemini:
      api-key: ${GEMINI_API_KEY:${GOOGLE_API_KEY:}}
    models:
      planner: ${MODLESS_AI_PLANNER_MODEL:}
      responder: ${MODLESS_AI_RESPONDER_MODEL:}
      summarizer: ${MODLESS_AI_SUMMARIZER_MODEL:}
  allowed-origins:
    - http://127.0.0.1:5500
    - http://localhost:5500
    - http://127.0.0.1:8080
    - http://localhost:8080
    - http://localhost:8082
    - http://127.0.0.1:8082

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      enabled: ${MODLESS_METRICS_ENABLED:true}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  prometheus:
    metrics:
      export:
        enabled: ${MODLESS_METRICS_ENABLED:true}
  tracing:
    enabled: ${MODLESS_TRACING_ENABLED:false}
    sampling:
      probability: ${MODLESS_TRACING_SAMPLE_RATE:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} requestId=%X{requestId:-} %kvp - %msg%n%wEx"
    file: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} requestId=%X{requestId:-} %kvp - %msg%n%wEx"
  level:
    root: INFO
    io.mehdieidi.modless: DEBUG
