server:
  port: 8080
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types:
      - application/json
      - application/*+json
      - text/plain
    min-response-size: 1024

spring:
  application:
    name: varka-backend
  ai:
    # The local transformer implementation is packaged, but stays disabled until the deployment
    # supplies a verified, cached ONNX model/tokenizer. Lexical retrieval is always available.
    model:
      embedding: ${VARKA_AI_EMBEDDING_PROVIDER:none}
  # Compose injects .env explicitly. These optional imports give the same configuration to a
  # backend started from the repository root or apps/backend in a WSL terminal.
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../../.env[.properties]
  datasource:
    url: ${VARKA_DB_URL:jdbc:postgresql://localhost:5432/varka}
    username: ${VARKA_DB_USER:varka}
    password: ${VARKA_DB_PASSWORD:varka}
    hikari:
      maximum-pool-size: ${VARKA_DB_MAX_POOL_SIZE:10}
      minimum-idle: ${VARKA_DB_MIN_IDLE:2}
      connection-timeout: 30000
      validation-timeout: 5000
  flyway:
    enabled: true
    ignore-migration-patterns: "*:missing"
    locations:
      - classpath:db/migration
      - classpath:db/assistant-migration
    validate-migration-naming: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

varka:
  session-ttl: 30d
  guest:
    prompt-limit: ${VARKA_GUEST_PROMPT_LIMIT:5}
  admin:
    bootstrap-enabled: ${VARKA_ADMIN_BOOTSTRAP_ENABLED:false}
    bootstrap-emails: ${VARKA_ADMIN_BOOTSTRAP_EMAILS:}
    bootstrap-token: ${VARKA_ADMIN_BOOTSTRAP_TOKEN:}
  mde:
    execution-timeout: ${VARKA_MDE_EXECUTION_TIMEOUT:5m}
    job-timeout: ${VARKA_MDE_JOB_TIMEOUT:10m}
    max-captured-output-bytes: ${VARKA_MDE_MAX_CAPTURED_OUTPUT_BYTES:1048576}
    max-concurrent-jobs: ${VARKA_MDE_MAX_CONCURRENT_JOBS:2}
    queue-capacity: ${VARKA_MDE_QUEUE_CAPACITY:32}
    max-model-upload-bytes: ${VARKA_MDE_MAX_MODEL_UPLOAD_BYTES:20971520}
    max-generated-files: ${VARKA_MDE_MAX_GENERATED_FILES:2000}
    max-generated-file-bytes: ${VARKA_MDE_MAX_GENERATED_FILE_BYTES:5242880}
    max-generated-artifact-bytes: ${VARKA_MDE_MAX_GENERATED_ARTIFACT_BYTES:52428800}
    staged-import-ttl: ${VARKA_MDE_STAGED_IMPORT_TTL:2h}
    import-cleanup-interval: ${VARKA_MDE_IMPORT_CLEANUP_INTERVAL:PT15M}
  upload:
    root: ${VARKA_UPLOAD_ROOT:uploads}
    max-file-bytes: ${VARKA_UPLOAD_MAX_FILE_BYTES:1048576}
    max-text-chars: ${VARKA_UPLOAD_MAX_TEXT_CHARS:120000}
  ai:
    enabled: ${VARKA_AI_ENABLED:false}
    workflow-engine-v2: ${VARKA_AI_WORKFLOW_ENGINE_V2:true}
    provider: ${VARKA_AI_PROVIDER:openai}
    request-timeout: ${VARKA_AI_REQUEST_TIMEOUT:60s}
    turn-timeout: ${VARKA_AI_TURN_TIMEOUT:5m}
    max-agent-steps: ${VARKA_AI_MAX_AGENT_STEPS:4}
    token-budget: ${VARKA_AI_TOKEN_BUDGET:16000}
    max-prompt-tokens: ${VARKA_AI_MAX_PROMPT_TOKENS:24000}
    max-system-chars: ${VARKA_AI_MAX_SYSTEM_CHARS:14000}
    max-source-chunk-tokens: ${VARKA_AI_MAX_SOURCE_CHUNK_TOKENS:4000}
    max-source-chunks-per-turn: ${VARKA_AI_MAX_SOURCE_CHUNKS_PER_TURN:24}
    max-provider-calls-per-turn: ${VARKA_AI_MAX_PROVIDER_CALLS_PER_TURN:2}
    max-provider-calls-source-turn: ${VARKA_AI_MAX_PROVIDER_CALLS_SOURCE_TURN:3}
    source-turn-timeout: ${VARKA_AI_SOURCE_TURN_TIMEOUT:2m}
    fallback-provider: ${VARKA_AI_FALLBACK_PROVIDER:}
    hardening:
      per-user-requests-per-window: ${VARKA_AI_RATE_LIMIT_REQUESTS:30}
      rate-limit-window: ${VARKA_AI_RATE_LIMIT_WINDOW:1m}
      circuit-failure-threshold: ${VARKA_AI_CIRCUIT_FAILURE_THRESHOLD:3}
      circuit-open-duration: ${VARKA_AI_CIRCUIT_OPEN_DURATION:1m}
      provider-retry-attempts: ${VARKA_AI_PROVIDER_RETRY_ATTEMPTS:1}
      retry-backoff: ${VARKA_AI_RETRY_BACKOFF:250ms}
      recent-message-window: ${VARKA_AI_RECENT_MESSAGE_WINDOW:24}
    proxy:
      enabled: ${VARKA_AI_PROXY_ENABLED:false}
      type: ${VARKA_AI_PROXY_TYPE:HTTP}
      host: ${VARKA_AI_PROXY_HOST:127.0.0.1}
      port: ${VARKA_AI_PROXY_PORT:2081}
      connect-timeout: ${VARKA_AI_PROXY_CONNECT_TIMEOUT:2s}
    # Provider profiles allow FreeLLM to stay direct while providers such as Freemodel use a
    # separate proxy/TLS route. Omitted fields retain the global proxy settings.
    provider-proxies:
      openai:
        enabled: ${VARKA_AI_OPENAI_PROXY_ENABLED:${VARKA_AI_PROXY_ENABLED:false}}
        type: ${VARKA_AI_OPENAI_PROXY_TYPE:${VARKA_AI_PROXY_TYPE:HTTP}}
        host: ${VARKA_AI_OPENAI_PROXY_HOST:${VARKA_AI_PROXY_HOST:127.0.0.1}}
        port: ${VARKA_AI_OPENAI_PROXY_PORT:${VARKA_AI_PROXY_PORT:2081}}
        connect-timeout: ${VARKA_AI_OPENAI_PROXY_CONNECT_TIMEOUT:${VARKA_AI_PROXY_CONNECT_TIMEOUT:2s}}
      gemini:
        enabled: ${VARKA_AI_GEMINI_PROXY_ENABLED:${VARKA_AI_PROXY_ENABLED:false}}
        type: ${VARKA_AI_GEMINI_PROXY_TYPE:${VARKA_AI_PROXY_TYPE:HTTP}}
        host: ${VARKA_AI_GEMINI_PROXY_HOST:${VARKA_AI_PROXY_HOST:127.0.0.1}}
        port: ${VARKA_AI_GEMINI_PROXY_PORT:${VARKA_AI_PROXY_PORT:2081}}
        connect-timeout: ${VARKA_AI_GEMINI_PROXY_CONNECT_TIMEOUT:${VARKA_AI_PROXY_CONNECT_TIMEOUT:2s}}
    openai-compatible:
      base-url: ${OPENAI_COMPATIBLE_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_COMPATIBLE_API_KEY:}
      protocol: ${VARKA_AI_OPENAI_PROTOCOL:auto}
    gemini:
      api-key: ${GEMINI_API_KEY:}
    models:
      director: ${VARKA_AI_DIRECTOR_MODEL:}
      modeler: ${VARKA_AI_MODELER_MODEL:}
      critic: ${VARKA_AI_CRITIC_MODEL:}
      summarizer: ${VARKA_AI_SUMMARIZER_MODEL:}
      responder: ${VARKA_AI_RESPONDER_MODEL:}
  allowed-origins:
    # Override entirely with comma-separated VARKA_ALLOWED_ORIGINS (Compose sets this from port vars).
    - http://127.0.0.1:5500
    - http://localhost:5500
    - http://127.0.0.1:8080
    - http://localhost:8080
    - http://localhost:8082
    - http://127.0.0.1:8082
    - http://127.0.0.1:8088
    - http://localhost:8088

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      enabled: ${VARKA_METRICS_ENABLED:true}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  prometheus:
    metrics:
      export:
        enabled: ${VARKA_METRICS_ENABLED:true}
  tracing:
    enabled: ${VARKA_TRACING_ENABLED:false}
    sampling:
      probability: ${VARKA_TRACING_SAMPLE_RATE:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} requestId=%X{requestId:-} %kvp - %msg%n%wEx"
    file: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} requestId=%X{requestId:-} %kvp - %msg%n%wEx"
  level:
    root: INFO
    io.mehdieidi.varka: DEBUG
