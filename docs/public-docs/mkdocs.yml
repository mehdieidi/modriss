site_name: MODRISS
site_url: https://docs.modriss.site
site_description: Technical documentation for MODRISS, an academic research project on model-driven serverless software development
repo_name: modriss
repo_url: https://github.com/mehdieidi/modriss
theme:
  name: material
  logo: assets/modriss-logo.svg
  favicon: assets/modriss-favicon.svg
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: blue grey
      accent: teal
    - scheme: slate
      primary: blue grey
      accent: teal
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/doc-image-viewer.js
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
