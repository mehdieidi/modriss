components:
  securitySchemes:
    AuthToken:
      type: apiKey
      in: header
      name: X-Auth-Token
  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: string
    ModelId:
      name: id
      in: path
      required: true
      schema:
        type: string
    ArtifactId:
      name: id
      in: path
      required: true
      schema:
        type: string
    ModelLevelPath:
      name: level
      in: path
      required: true
      schema:
        type: string
        enum: [cim, pim, psm]
    WildcardPath:
      name: path
      in: path
      required: true
      schema:
        type: string
      description: Wildcard path handled by a planned endpoint placeholder.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 256
      description: Replays the original async MDE job when the request fingerprint matches.
  requestBodies:
    TransformRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TransformRequest"
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    Unauthorized:
      description: Missing, invalid, or expired auth session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    Forbidden:
      description: Authenticated user does not have permission
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    NotFound:
      description: Record or file not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    Conflict:
      description: Revision or state conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    PayloadTooLarge:
      description: Upload or generated payload exceeds configured limits
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    UnsupportedMediaType:
      description: Uploaded media type or file format is not supported
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    NotImplemented:
      description: Planned feature placeholder
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    TransformationResponse:
      description: Transformation result
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TransformationResponse"
    MdeJobAccepted:
      description: MDE job accepted
      headers:
        Location:
          description: Polling URL for the accepted job
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JobResponse"
  schemas:
    ApiErrorResponse:
      type: object
      required: [message, status, timestamp, issues, errorId]
      properties:
        message:
          type: string
        status:
          type: integer
        timestamp:
          type: string
          format: date-time
        issues:
          type: array
          items: {}
        errorId:
          type: string
          description: Correlation id for support and log lookup
    HealthResponse:
      type: object
      required: [status, service, timestamp]
      properties:
        status:
          type: string
          example: UP
        service:
          type: string
          example: modriss-backend
        timestamp:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        displayName:
          type: string
          maxLength: 80
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    UpdateMeRequest:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          maxLength: 80
    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/UserDto"
    UserDto:
      type: object
      required: [id, displayName, guest]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
          nullable: true
        displayName:
          type: string
        guest:
          type: boolean
    SaveProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        activeModelIds:
          type: object
          additionalProperties:
            type: string
          description: Map of active model level or view keys to model ids.
    InviteRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          maxLength: 48
    UpdateMemberRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          maxLength: 48
    ProjectRecord:
      type: object
      required: [id, name, ownerUserId, activeModelIds, members, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        ownerUserId:
          type: string
        activeModelIds:
          type: object
          additionalProperties:
            type: string
        members:
          type: array
          items:
            $ref: "#/components/schemas/ProjectMember"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProjectMember:
      type: object
      required: [userId, email, displayName, role, addedAt]
      properties:
        userId:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          type: string
        addedAt:
          type: string
          format: date-time
    ModelLevel:
      type: string
      enum: [CIM, PIM, PSM]
    SaveModelRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        model:
          description: CIM, PIM, or PSM model JSON.
        projectId:
          type: string
        expectedRevision:
          type: integer
          format: int64
          description: Required for PUT updates.
    PatchModelRequest:
      type: object
      required: [expectedRevision]
      properties:
        name:
          type: string
        operations:
          type: array
          items:
            $ref: "#/components/schemas/ModelPatchOperation"
        expectedRevision:
          type: integer
          format: int64
    ModelPatchOperation:
      type: object
      required: [op, path]
      properties:
        op:
          type: string
          enum: [add, replace, remove]
        path:
          type: string
          description: JSON Pointer path.
        value:
          description: JSON value for add or replace.
    ExportRequest:
      type: object
      properties:
        name:
          type: string
        model:
          description: Model JSON used by unsaved export.
        format:
          type: string
          enum: [json, xmi]
          default: json
    ModelSummary:
      type: object
      required: [id, projectId, level, name, revision, createdAt, updatedAt]
      properties:
        id:
          type: string
        projectId:
          type: string
        level:
          $ref: "#/components/schemas/ModelLevel"
        name:
          type: string
        revision:
          type: integer
          format: int64
        metamodelVersion:
          type: string
        migrationState:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ModelRecord:
      allOf:
        - $ref: "#/components/schemas/ModelSummary"
        - type: object
          properties:
            modelJson:
              description: Stored model JSON.
            metamodelHash:
              type: string
            sourceXmiHash:
              type: string
    ValidationResult:
      type: object
      required: [valid, issues]
      properties:
        valid:
          type: boolean
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
    SynchronizationResult:
      type: object
      required:
        [
          status,
          targetModelId,
          incomingChanges,
          preservedUserChanges,
          autoMergedChanges,
          conflicts,
          generatedAdditions,
          generatedDeletions,
          conflictDetails,
          validationFindings,
        ]
      properties:
        status:
          type: string
          enum: [APPLIED, CONFLICTS, BOOTSTRAP_REQUIRED, VALIDATION_FAILED]
        sessionId:
          type: string
          nullable: true
        targetModelId: { type: string }
        incomingChanges: { type: integer }
        preservedUserChanges: { type: integer }
        autoMergedChanges: { type: integer }
        conflicts: { type: integer }
        generatedAdditions: { type: integer }
        generatedDeletions: { type: integer }
        conflictDetails:
          type: array
          items:
            $ref: "#/components/schemas/ModelConflict"
        validationFindings:
          type: array
          items: { type: string }
    ModelConflict:
      type: object
      properties:
        conflictId: { type: string }
        transformationDirection:
          type: string
          enum: [CIM_TO_PIM, PIM_TO_AWS_PSM]
        elementId: { type: string }
        elementEClass: { type: string }
        elementName: { type: string }
        featureName: { type: string }
        differenceKind: { type: string }
        path: { type: string }
        baseValue: {}
        workingValue: {}
        generatedValue: {}
        description: { type: string }
        availableResolutions:
          type: array
          items:
            type: string
            enum: [KEEP_USER, TAKE_GENERATED]
    ConflictResolutionRequest:
      type: object
      required: [conflictId, resolution]
      properties:
        conflictId: { type: string }
        resolution:
          type: string
          enum: [KEEP_USER, TAKE_GENERATED]
    BatchConflictResolutionRequest:
      type: object
      required: [resolutions]
      properties:
        resolutions:
          type: object
          minProperties: 1
          additionalProperties:
            type: string
            enum: [KEEP_USER, TAKE_GENERATED]
    SynchronizationSession:
      type: object
      required:
        [
          id,
          direction,
          projectId,
          sourceModelId,
          targetModelId,
          workingRevision,
          baselineVersion,
          conflicts,
          resolutions,
        ]
      properties:
        id: { type: string }
        direction:
          type: string
          enum: [CIM_TO_PIM, PIM_TO_AWS_PSM]
        projectId: { type: string }
        sourceModelId: { type: string }
        targetModelId: { type: string }
        workingRevision: { type: integer, format: int64 }
        workingFingerprint: { type: string }
        baselineVersion: { type: integer, format: int64 }
        newSourceRevision: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/ModelConflict"
        resolutions:
          type: object
          additionalProperties:
            type: string
            enum: [KEEP_USER, TAKE_GENERATED]
    ValidationIssue:
      type: object
      properties:
        severity:
          type: string
        constraint:
          type: string
        issueClass:
          type: string
        message:
          type: string
        guidance:
          type: string
        elementId:
          type: string
        elementName:
          type: string
    ImportResult:
      type: object
      required: [name, modelJson, issues]
      properties:
        name:
          type: string
        modelJson:
          description: Imported model JSON.
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
    CreateAssistantSessionRequest:
      type: object
      required: [modelType, projectId]
      properties:
        modelType:
          type: string
          enum: [cim, pim]
        modelName: { type: string }
        initialDocument:
          type: string
          description: Legacy initial document hint.
        projectId: { type: string }
        resumeSessionId: { type: string }
        forceNew: { type: boolean }
    CreateAssistantSessionResponse:
      type: object
      required: [sessionId]
      properties:
        sessionId: { type: string }
        modelId:
          type: string
          nullable: true
    AssistantConversation:
      type: object
      properties:
        sessionId: { type: string }
        title: { type: string }
        preview: { type: string }
        updatedAt: { type: string, format: date-time }
        messageCount: { type: integer }
    AssistantMessageRequest:
      type: object
      required: [message, idempotencyKey]
      description: >-
        Unified chatbot request. model/revision and selection are authoritative structural context;
        they are not hints for a client-selected modeling engine.
      properties:
        message:
          type: string
        modelId:
          type: string
        revision:
          type: integer
          format: int64
        expectedRevision:
          type: integer
          format: int64
        activeView:
          type: string
          enum: [CIM, PIM]
          description: Current assistant-supported canvas level. PSM assistant sessions are unsupported.
        selectedElementIds:
          type: array
          items:
            type: string
        attachmentIds:
          type: array
          items:
            type: string
        attachmentName:
          type: string
          description: Optional inline attachment name. Prefer uploaded attachmentIds for files.
        attachmentContent:
          type: string
          description: Optional inline text attachment content.
        idempotencyKey:
          type: string
    AssistantAttachmentResponse:
      type: object
      required: [id, fileName, contentType, sizeBytes]
      properties:
        id:
          type: string
        fileName:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        level:
          type: string
        projectId:
          type: string
        uploadedAt:
          type: string
          format: date-time
    TurnAcceptedResponse:
      type: object
      required: [turnId, state, eventCursor]
      properties:
        turnId:
          type: string
        state:
          $ref: "#/components/schemas/AssistantTurnState"
        modelId:
          type: string
        revision:
          type: integer
          format: int64
        acceptedAt:
          type: string
          format: date-time
        deadlineAt:
          type: string
          format: date-time
        eventCursor:
          type: integer
          format: int64
    TurnStatusResponse:
      type: object
      required: [turnId, state, checkpointCount, savedElementCount, providerCalls]
      properties:
        turnId:
          type: string
        state:
          $ref: "#/components/schemas/AssistantTurnState"
        modelId:
          type: string
        revision:
          type: integer
          format: int64
        checkpoints:
          type: array
          items:
            $ref: "#/components/schemas/AssistantCheckpoint"
        checkpointCount:
          type: integer
        savedElementCount:
          type: integer
        coveragePercent:
          type: integer
          minimum: 0
          maximum: 100
          description: >-
            Enforced source and/or mandatory-obligation accounting for the active workflow. This is
            not EVL semantic validity.
        remainingWork:
          type: string
        finalMessage:
          type: string
        providerCalls:
          type: integer
        promptTokens:
          type: integer
          format: int64
        completionTokens:
          type: integer
          format: int64
        repairAttempts:
          type: integer
        provenance:
          type: array
          items:
            $ref: "#/components/schemas/AssistantProvenance"
        continuations:
          type: array
          items:
            $ref: "#/components/schemas/AssistantContinuation"
        workflowKind:
          type: string
          description: Diagnostic durable workflow identifier; observational, not client-selectable.
        phase:
          type: string
          description: Current persisted workflow phase.
        currentWorkItemId:
          type: string
        workItems:
          type: array
          items:
            $ref: "#/components/schemas/AssistantWorkItem"
    AssistantTurnState:
      type: string
      enum:
        [
          QUEUED,
          RUNNING,
          SUCCEEDED,
          PARTIAL,
          NEEDS_INPUT,
          NEEDS_CONFIRMATION,
          CONFLICTED,
          CANCELLED,
          TIMED_OUT,
          FAILED,
        ]
    AssistantCheckpoint:
      type: object
      description: >-
        Revision-checked assistant checkpoint accepted after structural Ecore/EMF validation. It
        does not assert EVL semantic validity.
      properties:
        checkpointId:
          type: integer
          format: int64
        ordinal:
          type: integer
        label:
          type: string
        modelId:
          type: string
        revision:
          type: integer
          format: int64
        status:
          type: string
    AssistantProvenance:
      type: object
      properties:
        elementId:
          type: string
        sourceUnitId:
          type: string
        requirementId:
          type: string
        kind:
          type: string
          enum: [SOURCE_GROUNDED, INFERRED]
        assumption:
          type: string
    AssistantContinuation:
      type: object
      properties:
        turnId:
          type: string
        state:
          $ref: "#/components/schemas/AssistantTurnState"
        revision:
          type: integer
          format: int64
    AssistantWorkItem:
      type: object
      properties:
        id:
          type: string
        ordinal:
          type: integer
        label:
          type: string
        status:
          type: string
    TurnUndoResponse:
      type: object
      required: [modelId, revision]
      properties:
        modelId:
          type: string
        revision:
          type: integer
          format: int64
    RebaseTurnRequest:
      type: object
      required: [expectedRevision]
      properties:
        expectedRevision:
          type: integer
          format: int64
    TurnFeedbackRequest:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: boolean
    TransformRequest:
      type: object
      required: [sourceModelId]
      properties:
        sourceModelId:
          type: string
        expectedRevision:
          type: integer
          format: int64
    TransformationResponse:
      type: object
      required: [success, status, diagnostics]
      properties:
        success:
          type: boolean
        status:
          type: string
          example: SUCCEEDED
        resultModelId:
          type: string
        resultArtifactId:
          type: string
        model:
          allOf:
            - $ref: "#/components/schemas/ModelRecord"
        artifact:
          allOf:
            - $ref: "#/components/schemas/ArtifactRecord"
        diagnostics:
          type: array
          items:
            type: string
    ArtifactRecord:
      type: object
      required: [id, projectId, name, modelJson, files, createdAt, updatedAt]
      properties:
        id:
          type: string
        projectId:
          type: string
        name:
          type: string
        modelJson:
          description: Source PSM model JSON.
        files:
          type: object
          additionalProperties:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SaveFileRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
        content:
          type: string
    JobResponse:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED]
    MdeJobRecord:
      type: object
      required:
        [
          id,
          projectId,
          userId,
          sourceModelId,
          sourceLevel,
          sourceRevision,
          operation,
          status,
          progressPercent,
          diagnostics,
          createdAt,
        ]
      properties:
        id:
          type: string
        projectId:
          type: string
        userId:
          type: string
        sourceModelId:
          type: string
        sourceLevel:
          $ref: "#/components/schemas/ModelLevel"
        sourceRevision:
          type: integer
          format: int64
        sourceModelHash:
          type: string
        operation:
          type: string
          enum: [CIM_TO_PIM, PIM_TO_PSM, PSM_TO_ARTIFACT, VALIDATE]
        status:
          type: string
          enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED]
        progressPercent:
          type: integer
          minimum: 0
          maximum: 100
        resultModelId:
          type: string
        resultArtifactId:
          type: string
        diagnostics:
          type: array
          items:
            type: string
        validationResult:
          oneOf:
            - $ref: "#/components/schemas/ValidationResult"
            - $ref: "#/components/schemas/SynchronizationResult"
        timings:
          type: object
          additionalProperties:
            type: integer
            format: int64
        idempotencyKey:
          type: string
        fingerprint:
          type: string
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
    LayoutRequest:
      type: object
      properties:
        viewId:
          type: string
        profile:
          type: string
        preserveExistingPositions:
          type: boolean
        fixedNodeIds:
          type: array
          items:
            type: string
        options:
          type: object
          additionalProperties: true
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/LayoutNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/LayoutEdge"
    LayoutNode:
      type: object
      required: [id, width, height]
      properties:
        id:
          type: string
        label:
          type: string
        width:
          type: number
          format: double
        height:
          type: number
          format: double
        x:
          type: number
          format: double
        y:
          type: number
          format: double
        ports:
          type: array
          items:
            $ref: "#/components/schemas/LayoutPort"
    LayoutPort:
      type: object
      required: [id, width, height]
      properties:
        id:
          type: string
        label:
          type: string
        width:
          type: number
          format: double
        height:
          type: number
          format: double
        x:
          type: number
          format: double
        y:
          type: number
          format: double
    LayoutEdge:
      type: object
      required: [id, sourceNodeId, targetNodeId]
      properties:
        id:
          type: string
        label:
          type: string
        sourceNodeId:
          type: string
        targetNodeId:
          type: string
        sourcePortId:
          type: string
        targetPortId:
          type: string
    LayoutResponse:
      type: object
      required: [nodes, edges, warnings]
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/LaidOutNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/RoutedEdge"
        warnings:
          type: array
          items:
            type: string
    LaidOutNode:
      type: object
      required: [id, x, y, width, height]
      properties:
        id:
          type: string
        x:
          type: number
          format: double
        y:
          type: number
          format: double
        width:
          type: number
          format: double
        height:
          type: number
          format: double
    RoutedEdge:
      type: object
      required: [id, sections, bendPoints]
      properties:
        id:
          type: string
        sections:
          type: array
          items:
            $ref: "#/components/schemas/EdgeSection"
        bendPoints:
          type: array
          items:
            $ref: "#/components/schemas/LayoutPoint"
    EdgeSection:
      type: object
      required: [startPoint, endPoint, bendPoints]
      properties:
        startPoint:
          $ref: "#/components/schemas/LayoutPoint"
        endPoint:
          $ref: "#/components/schemas/LayoutPoint"
        bendPoints:
          type: array
          items:
            $ref: "#/components/schemas/LayoutPoint"
    LayoutPoint:
      type: object
      required: [x, y]
      properties:
        x:
          type: number
          format: double
        y:
          type: number
          format: double
