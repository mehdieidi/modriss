        elementId:
          type: string
        sourceUnitId:
          type: string
        requirementId:
          type: string
        kind:
          type: string
          enum: [SOURCE_GROUNDED, INFERRED]
        assumption:
          type: string
    AssistantContinuation:
      type: object
      properties:
        turnId:
          type: string
        state:
          $ref: "#/components/schemas/AssistantTurnState"
        revision:
          type: integer
          format: int64
    AssistantWorkItem:
      type: object
      properties:
        id:
          type: string
        ordinal:
          type: integer
        label:
          type: string
        status:
          type: string
    TurnUndoResponse:
      type: object
