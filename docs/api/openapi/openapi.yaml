      properties:
        modelId: { type: string }
        modelType: { type: string }
        modelName: { type: string }
        metadata:
          description: Artifact metadata JSON.
        ancestors:
          type: array
          items: { $ref: "#/components/schemas/ModelAncestor" }
    ModelAncestor:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        name: { type: string }
    FrontendTelemetryEvent:
      type: object
      required: [app, kind]
      example:
        app: editor
        kind: page_view
        url: /projects/project-123
        attributes:
          referrer: https://example.com/
      properties:
        app:
          type: string
          maxLength: 40
          description: Browser application identifier.
        kind:
          type: string
          maxLength: 40
          description: Event kind; `page_view` events are added to visit analytics.
        message: { type: string, maxLength: 300 }
        url: { type: string, maxLength: 300 }
        durationMs: { type: integer, format: int64, minimum: 0 }
        attributes:
          type: object
          maxProperties: 20
          additionalProperties:
            type: string
            maxLength: 120
        occurredAt:
          type: string
          format: date-time
          description: Optional client event time; the server records receipt time separately.
    AssistantWorkflowState:
      type: string
      enum: [EXPLAINED, APPLIED, UNDONE, WAITING_FOR_CHOICE, FAILED]
    AssistantProviderMetadata:
      type: object
      properties:
        provider: { type: string }
        baseUrl: { type: string, format: uri }
        proxy: { type: string }
        model: { type: string }
    AssistantActiveTurn:
      type: object
      required: [turnId, state, eventCursor]
      properties:
        turnId: { type: string }
        state: { $ref: "#/components/schemas/AssistantTurnState" }
        eventCursor: { type: integer, format: int64 }
    AssistantThreadMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
    AssistantThreadResponse:
      type: object
      required: [messages, workflowState]
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/AssistantThreadMessage" }
        workflowState: { $ref: "#/components/schemas/AssistantWorkflowState" }
        provider: { $ref: "#/components/schemas/AssistantProviderMetadata" }
        activeTurn: { $ref: "#/components/schemas/AssistantActiveTurn" }
    AssistantMessageResponse:
      type: object
      properties:
        assistantMessage: { type: string }
        modelId: { type: string }
        revision: { type: integer, format: int64 }
        model:
          description: Optional model JSON. Currently withheld by the backend.
        proposal: { $ref: "#/components/schemas/AssistantProposal" }
        workflowState: { $ref: "#/components/schemas/AssistantWorkflowState" }
        activity: { $ref: "#/components/schemas/AssistantActivity" }
    AssistantActivity:
      type: object
      properties:
        stage: { type: string }
        message: { type: string }
        workflowState: { $ref: "#/components/schemas/AssistantWorkflowState" }
    AssistantProposal:
      type: object
      description: >-
        Audited legacy assistant change proposal. Its validation preview records structural
        Ecore/EMF conformance and does not assert EVL semantic validity.
      properties:
        id: { type: string }
        affectedElements:
          type: array
          items: { type: string }
        patch: { $ref: "#/components/schemas/SemanticModelPatch" }
        inversePatch:
          type: array
          items: { $ref: "#/components/schemas/ModelPatchOperation" }
        validation: { $ref: "#/components/schemas/AssistantValidationSummary" }
        riskLevel: { type: string, enum: [LOW, MEDIUM, HIGH] }
        citations:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
    SemanticModelPatch:
      type: object
      properties:
        operations:
          type: array
          items: { $ref: "#/components/schemas/SemanticModelOperation" }
    SemanticModelOperation:
      type: object
      properties:
        type: { type: string, enum: [ADD_ELEMENT, CONNECT_ELEMENTS, SET_ATTRIBUTE, DELETE_ELEMENT] }
        targetElementId: { type: string }
        elementType: { type: string }
        attributes:
          description: Operation attributes JSON.
        sourceElementId: { type: string }
        referenceName: { type: string }
    AssistantValidationSummary:
      type: object
      properties:
        structurallyValid: { type: boolean }
        mandatoryPassed: { type: boolean }
        optionalIssues: { type: integer }
        issues:
          type: array
          items: { $ref: "#/components/schemas/AssistantValidationIssue" }
    AssistantValidationIssue:
      type: object
      properties:
        severity: { type: string }
        constraint: { type: string }
        elementId: { type: string }
        message: { type: string }
