openapi: 3.1.0
info:
  title: MODRISS Backend API
  version: 0.0.1
  description: >-
    Interactive reference for the MODRISS backend. Most endpoints require the `X-Auth-Token`
    header. Register and verify an account, sign in at `/api/auth/login`, then copy the returned
    token into **Authorize** in Swagger UI; enter the token as-is, without a `Bearer` prefix.

    A guest token can be created with `/api/auth/guest`. Guest accounts are isolated and have a
    configurable assistant prompt limit. Registration, password recovery, and email verification
    are public flows and do not require a token. Session tokens last 30 days by default; the server
    can override this duration.

    Model writes use optimistic concurrency. Send the current `expectedRevision` when replacing or
    patching a stored model; stale revisions return `409 Conflict`. MDE transformations and stored
    validation can run asynchronously: `202 Accepted` responses include a job identifier and
    polling location. Poll the returned job endpoint for status and results.

    Assistant messages create durable turns and return `202 Accepted`. Subscribe to the session
    event stream for live updates, or poll turn status and replay durable events after a disconnect.
    Assistant generated actions, proposals, checkpoints, and committed model output are gated only
    by structural Ecore/EMF conformance. EVL semantic validation is available through explicit
    model-validation workflows and is not run by assistant apply, repair, or commit paths.

    Errors use the `ApiErrorResponse` shape. Its `errorId` is a correlation identifier that can be
    supplied to support when investigating a failed request. Model imports and assistant attachments
    use multipart form data; model and project exports return downloadable files.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://127.0.0.1:8080
    description: Local development
security:
  - AuthToken: []
tags:
  - name: Health
    description: Public liveness and readiness information for the backend API.
  - name: Auth
    description: >-
      Public registration, email verification, password reset, guest session creation, and
      authenticated profile and session management. Login and guest creation return the
      `X-Auth-Token` value used by protected endpoints.
  - name: Projects
    description: >-
      Project CRUD, project downloads, and membership management. Project owners control project
      membership and can invite existing users by email.
  - name: Models
    description: >-
      CIM, PIM, and PSM model CRUD, views, validation, import, and export. Stored model writes use
      optimistic concurrency through `expectedRevision`. Structural validation checks Ecore/EMF
      conformance; the general validation endpoints run the user-requested model validation rules.
  - name: Transformations
    description: >-
      Model-to-model and model-to-artifact transformations. Long-running work is accepted as an MDE
      job; use its job ID to poll status and retrieve generated models, artifacts, diagnostics, and
      timing details.
  - name: Cloud platforms
    description: Project-owned immutable Ecore and Epsilon packages, independent custom PSM branches, and artifact history. User scripts execute synchronously in disposable containers.
  - name: Synchronizations
    description: >-
      Three-way synchronization sessions for generated model changes. Inspect conflicts, record
      per-conflict or batch resolutions, then finalize the session to validate and commit the merge.
  - name: Artifacts
    description: Generated artifact metadata, file access and updates, ZIP downloads, and lineage.
  - name: Modeling
    description: Modeling metadata, methodology content, metamodel coverage, and diagram layout.
  - name: Assistant
    description: >-
      Unified durable AI modeling assistant sessions, turns, checkpoints, source provenance, and
      SSE replay. Clients do not select an internal agent or generation strategy. Message requests
      require an idempotency key in the JSON body. Use `attachmentIds` to attach previously uploaded
      files. A `202 Accepted` response means the durable turn was queued; it does not mean the model
      change has completed. Follow events or poll the turn status. Assistant generated output is
      gated only by structural Ecore/EMF conformance; EVL semantic validation remains a separate
      explicit model-validation workflow.
  - name: Impact
    description: Upstream and downstream impact analysis for model elements and generated artifacts.
  - name: Admin
    description: >-
      Administrative inspection and operations. Read access requires an `ADMIN`, `OPERATOR`, or
      `VIEWER` role. Mutations that require an operator accept `ADMIN` or `OPERATOR`; owner-level
      actions require `ADMIN`. Administrative routes also require the standard `X-Auth-Token`.
  - name: Telemetry
    description: Public ingestion of browser telemetry and page-visit events.
  - name: Theme
    description: Public retrieval of the active frontend theme profile.
paths:
  /api/health:
    get:
      tags: [Health]
      summary: Get backend health
      description: Returns the backend health state, service name, and current timestamp.
      security: []
      responses:
        "200":
          description: Backend health status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a user and send an email verification link
      description: >-
        The account cannot sign in until the email link is completed. The link expires after 24 hours.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: Account created; verification email is being sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          description: SMTP email delivery is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Create an auth session
      description: >-
        Verifies credentials and returns a session token. Pass the token in `X-Auth-Token` on
        protected requests. An unverified account cannot sign in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Created auth session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/auth/email-verification/request:
    post:
      tags: [Auth]
      summary: Resend an email verification link
      description: >-
        Returns the same response whether or not an unverified account exists for the email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailVerificationRequest"
      responses:
        "200":
          description: Generic response for every valid email address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailVerificationRequestResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          description: SMTP email delivery is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/auth/email-verification/complete:
    post:
      tags: [Auth]
      summary: Verify an account email address
      description: Completes email verification with the one-time token from the verification email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteEmailVerificationRequest"
      responses:
        "200":
          description: Email address verified
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/auth/password-reset/request:
    post:
      tags: [Auth]
      summary: Email a password reset link
      description: Returns the same response whether or not the email belongs to an account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "200":
          description: Generic response for every valid email address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetRequestResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          description: SMTP email delivery is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/auth/password-reset/complete:
    post:
      tags: [Auth]
      summary: Set a password from a reset link
      description: >-
        Replaces the account password using the one-time reset token and revokes all active
        sessions. Passwords must contain at least eight characters.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletePasswordResetRequest"
      responses:
        "200":
          description: Password updated and active sessions revoked
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/auth/guest:
    post:
      tags: [Auth]
      summary: Create an anonymous guest session
      description: Creates an isolated guest account. Guest accounts are limited to five assistant prompts by default.
      security: []
      responses:
        "200":
          description: Created guest session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      description: Returns the user associated with the supplied `X-Auth-Token`.
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Auth]
      summary: Update current user profile
      description: Updates the current user's display name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: End the current auth session
      description: Invalidates the session token supplied in `X-Auth-Token`.
      responses:
        "200":
          description: Session ended
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/projects:
    get:
      tags: [Projects]
      summary: List projects visible to the current user
      description: Returns projects owned by or shared with the authenticated user.
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Projects]
      summary: Create a project
      description: Creates a project owned by the authenticated user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveProjectRequest"
      responses:
        "200":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/projects/{id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      summary: Get a project
      description: Returns project details, active model references, and members visible to the caller.
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Projects]
      summary: Update a project
      description: Replaces the project name, description, and active model references.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveProjectRequest"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [Projects]
      summary: Delete a project
      description: Deletes a project when the authenticated user has owner access.
      responses:
        "200":
          description: Project deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/projects/{id}/download:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      summary: Download project ZIP
      description: Downloads a ZIP archive containing the project models and associated exported files.
      responses:
        "200":
          description: Project ZIP archive
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{id}/members:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      summary: List project members
      description: Lists users who currently have access to the project and their project roles.
      responses:
        "200":
          description: Project members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/projects/{id}/invite:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [Projects]
      summary: Invite an existing user to a project
      description: Adds an already registered user to the project using the requested role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteRequest"
      responses:
        "200":
          description: Added member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{id}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: userId
        in: path
        required: true
        schema:
          type: string
    put:
      tags: [Projects]
      summary: Update a project member role
      description: Replaces the project role assigned to an existing member.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRoleRequest"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Projects]
      summary: Revoke project access
      description: Removes a member from the project. Project owners cannot remove themselves through this endpoint.
      responses:
        "200":
          description: Access revoked
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/{level}:
    parameters:
      - $ref: "#/components/parameters/ModelLevelPath"
    get:
      tags: [Models]
      summary: List CIM, PIM, or PSM model summaries
      description: Returns models at the requested modeling level, optionally restricted to one project.
      parameters:
        - name: projectId
          in: query
          required: false
          description: Restrict the model list to this project when supplied.
          schema:
            type: string
      responses:
        "200":
          description: Model summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModelSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Models]
      summary: Create a CIM, PIM, or PSM model
      description: Creates a model in the supplied project and returns its current revision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveModelRequest"
      responses:
        "200":
          description: Created model summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/{level}/{id}:
    parameters:
      - $ref: "#/components/parameters/ModelLevelPath"
      - $ref: "#/components/parameters/ModelId"
    get:
      tags: [Models]
      summary: Get a stored model
      description: Returns the model JSON and, by default, its saved views.
      parameters:
        - name: includeViews
          in: query
          required: false
          description: Set to false to omit persisted views from the response.
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Models]
      summary: Replace a stored model
      description: >-
        Replaces the model JSON and optionally its name. `expectedRevision` is required and must
        match the current stored revision; stale revisions return `409 Conflict`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateModelRequest"
      responses:
        "200":
          description: Updated model summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    patch:
      tags: [Models]
      summary: Patch a stored model
      description: >-
        Applies JSON Pointer `add`, `replace`, and `remove` operations. Root replacement is not
        supported. `expectedRevision` is required; stale revisions return `409 Conflict`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchModelRequest"
      responses:
        "200":
          description: Updated model summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Models]
      summary: Delete a stored model
      description: Permanently deletes the stored model at this level and ID.
      responses:
        "200":
          description: Model deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/{level}/validate:
    parameters:
      - $ref: "#/components/parameters/ModelLevelPath"
    post:
      tags: [Models]
      summary: Validate unsaved model JSON
      description: >-
        Runs the explicit model-validation workflow against the supplied unsaved model. This is a
        user-initiated validation operation; its semantic findings are not used as assistant commit
        gates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelValidationRequest"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/{level}/validate/structural:
    parameters:
      - $ref: "#/components/parameters/ModelLevelPath"
    post:
      tags: [Models]
      summary: Validate unsaved model JSON for structural Ecore/EMF conformance
      description: Checks only structural Ecore/EMF conformance and reports structural findings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelValidationRequest"
      responses:
        "200":
          description: Structural validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/{level}/{id}/validate:
    parameters:
      - $ref: "#/components/parameters/ModelLevelPath"
      - $ref: "#/components/parameters/ModelId"
    post:
      tags: [Models]
      summary: Validate a stored model
      description: >-
        Runs the explicit model-validation workflow against the latest stored revision. This
        user-initiated operation may include semantic validation findings.
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/{level}/{id}/validate/structural:
    parameters:
      - $ref: "#/components/parameters/ModelLevelPath"
      - $ref: "#/components/parameters/ModelId"
    post:
      tags: [Models]
      summary: Validate a stored model for structural Ecore/EMF conformance
      description: Checks only structural Ecore/EMF conformance for the latest stored revision.
      responses:
        "200":
          description: Structural validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/{level}/{id}/validate/jobs:
    parameters:
      - $ref: "#/components/parameters/ModelLevelPath"
      - $ref: "#/components/parameters/ModelId"
    post:
      tags: [Models]
      summary: Submit asynchronous validation for a stored model
      description: >-
        Queues model validation as an MDE job. Use the optional expected revision to reject stale
        input, and poll the returned job location for status and results.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedRevision:
                  type: integer
                  format: int64
      responses:
        "202":
          $ref: "#/components/responses/MdeJobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/{level}/export:
    parameters:
      - $ref: "#/components/parameters/ModelLevelPath"
    post:
      tags: [Models]
      summary: Export unsaved model JSON
      description: Downloads an unsaved model as JSON or XMI. `format` defaults to `json`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportRequest"
      responses:
        "200":
          description: Exported model file
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
            application/xml:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/{level}/{id}/export:
    parameters:
      - $ref: "#/components/parameters/ModelLevelPath"
      - $ref: "#/components/parameters/ModelId"
    post:
      tags: [Models]
      summary: Export a stored model
      description: Downloads the stored model as JSON or XMI. `format` defaults to `json`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportRequest"
      responses:
        "200":
          description: Exported model file
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
            application/xml:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/{level}/import:
    parameters:
      - $ref: "#/components/parameters/ModelLevelPath"
    post:
      tags: [Models]
      summary: Import model JSON or XMI
      description: >-
        Uploads a model file as multipart form data and stages the imported model in the selected
        project. `format` defaults to `json`; use `xmi` for XMI input. The server enforces the
        configured upload-size limit.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [projectId, file]
              properties:
                projectId:
                  type: string
                format:
                  type: string
                  enum: [json, xmi]
                  default: json
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Imported model payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /api/transformations/cim-to-pim:
    post:
      tags: [Transformations]
      summary: Generate a PIM model from a CIM model
      description: >-
        Queues a CIM-to-PIM transformation job using the source model revision in the request.
        The optional idempotency key replays the original job for an identical request.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/TransformRequest"
      responses:
        "202":
          $ref: "#/components/responses/MdeJobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/transformations/pim-to-psm:
    post:
      tags: [Transformations]
      summary: Generate a PSM model from a PIM model
      description: >-
        Queues a PIM-to-PSM transformation job using the source model revision in the request.
        The optional idempotency key replays the original job for an identical request.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/TransformRequest"
      responses:
        "202":
          $ref: "#/components/responses/MdeJobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/transformations/psm-to-artifact:
    post:
      tags: [Transformations]
      summary: Generate deployable artifacts from a PSM model
      description: >-
        Queues artifact generation from the requested PSM revision. The response includes a job ID
        and polling location; use the job resource to inspect generated artifacts and diagnostics.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/TransformRequest"
      responses:
        "202":
          $ref: "#/components/responses/MdeJobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /api/transformations/jobs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Transformations]
      summary: Get a transformation job
      description: Returns current job status, progress, diagnostics, timing data, and any result IDs.
      responses:
        "200":
          description: Job record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MdeJobRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/transformations/jobs/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Transformations]
      summary: Cancel a transformation job
      description: Requests cancellation of a queued or running job and returns its updated job record.
      responses:
        "200":
          description: Cancelled job record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MdeJobRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/synchronizations/{projectId}/{sessionId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string }
      - name: sessionId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Synchronizations]
      summary: Get a pending model synchronization session and its conflicts
      description: Returns the working revision, detected conflicts, and resolutions recorded so far.
      responses:
        "200":
          description: Pending synchronization session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SynchronizationSession"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Synchronizations]
      summary: Cancel a pending model synchronization session
      description: Deletes an uncommitted synchronization session and its pending resolutions.
      responses:
        "204":
          description: Synchronization session cancelled
        "404":
          $ref: "#/components/responses/NotFound"
  /api/synchronizations/{projectId}/{sessionId}/resolutions:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string }
      - name: sessionId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Synchronizations]
      summary: Record a resolution for one model conflict
      description: Records the selected resolution for a single conflict and returns the updated session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConflictResolutionRequest"
      responses:
        "200":
          description: Updated pending synchronization session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SynchronizationSession"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/synchronizations/{projectId}/{sessionId}/resolutions/batch:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string }
      - name: sessionId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Synchronizations]
      summary: Record multiple conflict resolutions in one session update
      description: Records a batch of conflict resolutions atomically and returns the updated session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchConflictResolutionRequest"
      responses:
        "200":
          description: Updated pending synchronization session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SynchronizationSession"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/synchronizations/{projectId}/{sessionId}/finalize:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string }
      - name: sessionId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Synchronizations]
      summary: Validate and commit a fully resolved synchronization session
      description: >-
        Applies the selected resolutions, validates the merged model, and commits it when the target
        revision has not changed. An unresolved conflict or stale target revision returns a conflict.
      responses:
        "200":
          description: Synchronized working model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelRecord"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/artifact:
    get:
      tags: [Artifacts]
      summary: List artifacts for a project
      description: Returns artifact metadata and file paths without loading each artifact's model or file contents.
      parameters:
        - name: projectId
          in: query
          required: true
          description: Project whose artifacts should be listed.
          schema:
            type: string
      responses:
        "200":
          description: Artifacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArtifactSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/artifact/{id}:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    get:
      tags: [Artifacts]
      summary: Get an artifact
      description: Returns artifact metadata, generated model JSON, and the artifact file map.
      responses:
        "200":
          description: Artifact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/artifact/{id}/file:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
      - name: path
        in: query
        required: true
        description: Artifact-relative file path to read.
        schema:
          type: string
    get:
      tags: [Artifacts]
      summary: Read an artifact file
      description: Returns the UTF-8 text content at the artifact-relative `path` query parameter.
      responses:
        "200":
          description: File contents
          content:
            text/plain:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/artifact/{id}/files:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    put:
      tags: [Artifacts]
      summary: Save or replace an artifact file
      description: Creates or replaces one text file at the requested artifact-relative path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveFileRequest"
      responses:
        "200":
          description: Updated artifact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/artifact/{id}/download:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    get:
      tags: [Artifacts]
      summary: Download an artifact as a ZIP archive
      description: Downloads the generated model and all artifact files as a ZIP archive.
      responses:
        "200":
          description: ZIP archive
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/modeling/config:
    get:
      tags: [Modeling]
      summary: Get modeling palette and UI metadata
      description: Returns the palette, metamodel metadata, and editor configuration used by modeling clients.
      security: []
      responses:
        "200":
          description: Modeling configuration
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/modeling/process/{level}:
    get:
      tags: [Modeling]
      summary: Get modeling methodology process for a level
      description: Returns the process definition for CIM, PIM, PSM, artifact generation, or the end-to-end workflow.
      security: []
      parameters:
        - name: level
          in: path
          required: true
          schema:
            type: string
            enum: [cim, pim, psm, artifact, end-to-end]
      responses:
        "200":
          description: Modeling process definition
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/modeling/method-content:
    get:
      tags: [Modeling]
      summary: Get the consolidated SPEM method-content library
      description: Returns roles, tasks, work products, guidance, and process components for the methodology explorer.
      security: []
      responses:
        "200":
          description: Roles, tasks, work products, guidance, and process components
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/modeling/process/{level}/coverage:
    get:
      tags: [Modeling]
      summary: Get metamodel coverage for a modeling process level
      description: Returns the mapping between process steps and concepts represented by the selected level's metamodel.
      security: []
      parameters:
        - name: level
          in: path
          required: true
          schema:
            type: string
            enum: [cim, pim, psm]
      responses:
        "200":
          description: Modeling process coverage
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/layout:
    post:
      tags: [Modeling]
      summary: Auto-layout diagram nodes and edges
      description: Computes node coordinates and edge routes for an unsaved diagram without persisting the result.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LayoutRequest"
      responses:
        "200":
          description: Layout result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LayoutResponse"
  /api/{level}/{modelId}/views/{viewId}/layout:
    post:
      tags: [Modeling]
      summary: Lazily auto-layout and persist one stored model view
      description: >-
        Computes and stores positions for one existing model view. Existing positions are retained
        unless `force=true`. The mutation increments the stored model revision.
      parameters:
        - name: level
          in: path
          required: true
          schema:
            type: string
            enum: [cim, pim, psm]
        - name: modelId
          in: path
          required: true
          schema:
            type: string
        - name: viewId
          in: path
          required: true
          schema:
            type: string
        - name: force
          in: query
          required: false
          description: Recalculate and replace any existing layout when true.
          schema:
            type: boolean
            default: false
        - name: strategy
          in: query
          required: false
          description: Layout algorithm to apply. The current supported strategy is layered.
          schema:
            type: string
            enum: [LAYERED]
            default: LAYERED
      responses:
        "200":
          description: Persisted view layout result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredViewLayoutResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/{level}/{id}/views/{viewId}:
    get:
      tags: [Models]
      summary: Get one stored model view
      description: Returns the saved JSON view for the specified model and view identifier.
      parameters:
        - name: level
          in: path
          required: true
          schema:
            type: string
            enum: [cim, pim, psm]
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: viewId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stored view
          content:
            application/json:
              schema: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/impact/{level}/{modelId}/element/{elementId}:
    get:
      tags: [Impact]
      summary: Analyze model element impact
      description: >-
        Returns the focal element, traceable upstream sources, downstream dependents, and connected
        peers discovered across the model's project.
      parameters:
        - name: level
          in: path
          required: true
          schema:
            type: string
            enum: [cim, pim, psm]
        - name: modelId
          in: path
          required: true
          schema:
            type: string
        - name: elementId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Element impact graph containing focal element, upstream chain, downstream tree, and connected peers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElementImpactResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/impact/artifact/{artifactId}:
    get:
      tags: [Impact]
      summary: Analyze generated artifact lineage
      description: Returns artifact metadata and the ordered model ancestors used to generate it.
      parameters:
        - name: artifactId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Artifact metadata and ordered upstream model ancestors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactImpactResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/chatbot/conversations:
    get:
      tags: [Assistant]
      summary: List recent assistant conversations
      description: >-
        Lists up to 30 recent conversations for a project and CIM or PIM level. `days` sets the
        lookback window and defaults to 3.
      parameters:
        - name: projectId
          in: query
          required: true
          description: Project whose assistant conversations should be listed.
          schema: { type: string }
        - name: level
          in: query
          required: true
          description: Assistant-supported modeling level.
          schema: { type: string, enum: [cim, pim] }
        - name: days
          in: query
          required: false
          description: Number of days to look back; defaults to 3.
          schema: { type: integer, default: 3 }
      responses:
        "200":
          description: Recent conversations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AssistantConversation" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/chatbot/sessions:
    post:
      tags: [Assistant]
      summary: Create assistant session
      description: >-
        Creates a CIM/PIM assistant session, resumes the requested session when possible, or starts
        a fresh session when `forceNew` is true. PSM is not supported and returns HTTP 422.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAssistantSessionRequest" }
      responses:
        "200":
          description: Created assistant session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateAssistantSessionResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Unsupported PSM assistant level
  /api/chatbot/sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [Assistant]
      summary: Clear assistant session memory
      description: Clears the assistant's in-memory state for the session. Durable model records remain available.
      responses:
        "200":
          description: Session cleared
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/chatbot/sessions/{sessionId}/messages:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Assistant]
      summary: Send assistant message
      description: >-
        Accepts an idempotent durable assistant turn. Text attachments may be referenced by
        attachmentIds and can drive source-backed modeling. The backend automatically selects
        conceptual generation, inspect/contract editing, or a read-only answer; this request
        intentionally has no strategy or mode field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantMessageRequest"
      responses:
        "202":
          description: Durable assistant turn accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TurnAcceptedResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/chatbot/sessions/{sessionId}/attachments:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Assistant]
      summary: Upload assistant attachment
      description: >-
        Uploads a text or JSON source file for use in a later assistant message. Supported extensions
        are `.md`, `.txt`, and `.json`; the backend enforces its configured upload limit.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Uploaded attachment metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantAttachmentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /api/chatbot/sessions/{sessionId}/events:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Assistant]
      summary: Open assistant SSE event stream
      description: >-
        Opens a live server-sent event connection for the session. The stream is intended for live
        updates; use the durable turn event endpoint to replay events after a reconnect.
      responses:
        "200":
          description: Server-sent event stream
          content:
            text/event-stream:
              schema:
                type: string
                description: UTF-8 server-sent events.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/chatbot/sessions/{sessionId}/thread:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Assistant]
      summary: Get durable assistant thread history
      description: Returns recent messages, current workflow state, provider metadata, and any active turn.
      responses:
        "200":
          description: Assistant thread snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantThreadResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/chatbot/turns/{turnId}:
    parameters:
      - name: turnId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Assistant]
      summary: Get durable assistant turn status
      description: Polls the persisted state, checkpoints, provenance, and progress of one assistant turn.
      responses:
        "200":
          description: Durable turn status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TurnStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/chatbot/turns/{turnId}/cancel:
    parameters:
      - name: turnId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Assistant]
      summary: Persist cancellation for a durable turn
      description: Requests cancellation of the authenticated user's queued or running turn.
      responses:
        "202":
          description: Cancellation accepted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/chatbot/turns/{turnId}/continue:
    parameters:
      - name: turnId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Assistant]
      summary: Continue remaining work from a saved turn
      description: Resumes a partial or paused turn and returns the accepted continuation state.
      responses:
        "202":
          description: Continuation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TurnAcceptedResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/chatbot/turns/{turnId}/undo:
    parameters:
      - name: turnId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Assistant]
      summary: Apply a safe inverse checkpoint
      description: >-
        Applies the inverse of a safe persisted checkpoint if the model has not changed since that
        checkpoint. Returns `409 Conflict` when an inverse cannot be applied safely.
      responses:
        "200":
          description: Checkpoint undone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TurnUndoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          description: Durable checkpoint undo is unavailable.
  /api/chatbot/turns/{turnId}/confirm:
    parameters:
      - name: turnId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Assistant]
      summary: Confirm a pending destructive assistant batch
      description: >-
        Explicitly confirms a turn in `NEEDS_CONFIRMATION` state. Confirmation creates a new
        durable turn; it does not apply the destructive change synchronously.
      responses:
        "202":
          description: Confirmed turn accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TurnAcceptedResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/chatbot/turns/{turnId}/events:
    parameters:
      - name: turnId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Assistant]
      summary: Replay authenticated durable assistant events
      description: >-
        Streams persisted events for one turn. On reconnect send the last received event ID in
        `Last-Event-ID`; `eventCursor` provides a query-parameter cursor when the header is not
        available. The response ends after the turn reaches a terminal state.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: Resume after the latest event ID received by the client.
          schema:
            type: integer
            format: int64
        - name: eventCursor
          in: query
          required: false
          description: Resume after this event ID when Last-Event-ID is not supplied.
          schema:
            type: integer
            format: int64
            default: 0
      responses:
        "200":
          description: Server-sent event stream
          content:
            text/event-stream:
              schema:
                type: string
                description: >-
                  Each event uses its durable event ID as the SSE id, its event type as the SSE
                  event name, and a JSON event record as data.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
