          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/admin/user-login-events:
    get:
      tags: [Admin]
      summary: List user login events
      description: Returns login events with account, request, browser, device, IP, and country metadata.
      responses:
        "200":
          description: Recorded user login events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUserLoginEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/theme:
    get:
      tags: [Theme]
      summary: Get active theme
      description: Returns the currently active theme tokens for the requested color scheme.
      security: []
      parameters:
        - name: scheme
          in: query
          required: false
          description: Color scheme to retrieve.
          schema:
            type: string
            enum: [dark, light]
            default: dark
      responses:
        "200":
          description: Active theme profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThemeState"
  /api/projects/{projectId}/psm/packages:
    parameters:
      - $ref: "#/components/parameters/PsmProjectId"
    get:
      tags: [Cloud platforms]
      summary: List custom platform packages
      responses:
        "200":
          description: Immutable package summaries (excludes executable payloads)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PsmPackageSummary"
    post:
      tags: [Cloud platforms]
      summary: Check and store a platform package
      description: Ecore and all Epsilon scripts are checked before the immutable package is persisted. ZIP paths are relative to each archive root.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, ecore]
              properties:
                name: { type: string, maxLength: 120 }
                description: { type: string }
                ecore:
                  {
                    type: string,
                    format: binary,
                    description: Self-contained Ecore file; at most 5 MB,
                  }
                transformation:
                  {
                    type: string,
                    format: binary,
                    description: ETL and optional EOL ZIP; at most 10 MB,
                  }
                generation:
                  {
                    type: string,
                    format: binary,
                    description: EGX and EGL ZIP with optional EOL helpers; at most 10 MB,
                  }
                validation:
                  {
                    type: string,
                    format: binary,
                    description: Optional EVL and EOL ZIP; at most 10 MB,
                  }
                transformationEntry: { type: string, example: main.etl }
                generationEntry: { type: string, example: main.egx }
      responses:
        "201":
          description: Checked package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PsmPackageSummary"
        "400": { description: Invalid archive, path, entry script or size }
        "422": { description: Ecore or script syntax validation failed }
        "429": { description: Execution capacity reached }
        "503": { description: Isolated runner unavailable }
  /api/projects/{projectId}/psm/packages/{id}/{asset}:
    parameters:
      - $ref: "#/components/parameters/PsmProjectId"
      - $ref: "#/components/parameters/PsmRecordId"
      - name: asset
        in: path
        required: true
        schema:
          type: string
          enum: [platform.ecore, transformation.zip, generation.zip, validation.zip]
    get:
      tags: [Cloud platforms]
      summary: Download an original platform package asset
      responses:
        "200":
          description: Package asset
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { description: Package or asset not found }
  /api/projects/{projectId}/psm/packages/{id}/definition:
    parameters:
      - $ref: "#/components/parameters/PsmProjectId"
      - $ref: "#/components/parameters/PsmRecordId"
    get:
      tags: [Cloud platforms]
      summary: Read the Ecore schema and optional visual notation
      responses:
        "200":
          description: EClass schema and presentation document
          content:
            application/json:
              schema:
                {
                  type: object,
                  properties:
                    {
                      schema: { type: array, items: { type: object } },
                      visualSyntax: { type: object },
                    },
                }
  /api/projects/{projectId}/psm/packages/{id}/notation:
    parameters:
      - $ref: "#/components/parameters/PsmProjectId"
      - $ref: "#/components/parameters/PsmRecordId"
    put:
      tags: [Cloud platforms]
      summary: Save project provider visual notation
      description: Presentation only; validates root type, groups, icons and view type membership against the uploaded schema. Cannot change the root type of an existing model.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [rootType, paletteGroups, elements, views],
                additionalProperties: true,
              }
      responses:
        "200": { description: Updated schema and visual notation }
        "400": { description: Invalid presentation document }
        "409": { description: Root type incompatible with the existing model }
  /api/projects/{projectId}/psm/packages/{packageId}/model:
    parameters:
      - $ref: "#/components/parameters/PsmProjectId"
      - { name: packageId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Cloud platforms]
      summary: Create the package model from workbench semantic JSON
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PsmEditorSave" }
      responses:
        "200": { description: Workbench model record with id, name, revision and modelJson }
        "409": { description: This package already has a model }
        "422": { description: Model does not structurally conform to Ecore }
  /api/projects/{projectId}/psm/packages/{packageId}/model/{id}:
    parameters:
      - $ref: "#/components/parameters/PsmProjectId"
      - $ref: "#/components/parameters/PsmRecordId"
      - { name: packageId, in: path, required: true, schema: { type: string } }
    put:
      tags: [Cloud platforms]
      summary: Structurally validate and save semantic JSON with canvas state
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PsmEditorSave" }
      responses:
        "200": { description: Updated workbench model record }
        "409": { description: Stale model revision }
        "422": { description: Structural Ecore conformance failed }
  /api/projects/{projectId}/psm/packages/{packageId}/import:
    parameters:
      - $ref: "#/components/parameters/PsmProjectId"
      - { name: packageId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Cloud platforms]
      summary: Structurally validate XMI and return workbench semantic JSON
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [xmi], properties: { xmi: { type: string } } }
      responses:
        "200": { description: Semantic model JSON; does not persist or run EVL }
        "422": { description: Invalid XMI or structural conformance failure }
  /api/projects/{projectId}/psm/branches/{id}/editor:
    parameters:
      - $ref: "#/components/parameters/PsmProjectId"
      - $ref: "#/components/parameters/PsmRecordId"
    get:
      tags: [Cloud platforms]
      summary: Read the model as a normal workbench record
      responses:
        "200":
          {
            description: Object containing id,
            projectId,
            name,
            revision and semantic modelJson including saved canvas state,
          }
  /api/projects/{projectId}/psm/branches:
    parameters:
      - $ref: "#/components/parameters/PsmProjectId"
    get:
      tags: [Cloud platforms]
      summary: List custom provider models
      responses:
        "200":
          description: Branch summaries without XMI
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PsmBranchSummary"
    post:
      tags: [Cloud platforms]
      summary: Generate or regenerate the single package model from a saved PIM
      description: Runs the package ETL and gates persistence on structural EMF conformance. Existing branches and native AWS models remain available.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [packageId, sourcePimId, expectedRevision, name]
              properties:
                expectedTargetRevision:
                  {
                    type: integer,
                    minimum: 0,
                    description: Required current target revision when regenerating; zero for the first generation,
                  }
                packageId: { type: string }
                sourcePimId: { type: string }
                expectedRevision: { type: integer, minimum: 1 }
                name: { type: string, maxLength: 120 }
      responses:
        "201":
          description: Generated PSM branch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PsmBranch"
        "409": { description: Source PIM revision changed }
        "422": { description: ETL failed or output does not conform to Ecore }
  /api/projects/{projectId}/psm/branches/{id}:
    parameters:
      - $ref: "#/components/parameters/PsmProjectId"
      - $ref: "#/components/parameters/PsmRecordId"
    get:
      tags: [Cloud platforms]
      summary: Read a custom PSM branch and its XMI
      responses:
        "200":
          description: PSM branch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PsmBranch"
    put:
      tags: [Cloud platforms]
      summary: Structurally validate and save a custom PSM branch
      description: Uses the branch's immutable Ecore metamodel; does not run EVL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, xmi, expectedRevision]
              properties:
                name: { type: string, maxLength: 120 }
                xmi: { type: string }
                expectedRevision: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Saved branch with incremented revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PsmBranch"
        "409": { description: Branch revision changed }
        "422": { description: XMI does not conform to this branch's Ecore metamodel }
    delete:
      tags: [Cloud platforms]
      summary: Delete a PSM branch while preserving its generated artifacts
      parameters:
        - name: expectedRevision
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204": { description: Branch deleted }
        "409": { description: Branch revision changed }
  /api/projects/{projectId}/psm/branches/{id}/schema:
    parameters:
      - $ref: "#/components/parameters/PsmProjectId"
      - $ref: "#/components/parameters/PsmRecordId"
    get:
      tags: [Cloud platforms]
      summary: Inspect Ecore classes and features for this branch
      responses:
        "200":
          description: Structural inspection with Ecore language reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PsmWorkerResult"
  /api/projects/{projectId}/psm/branches/{id}/validate:
    parameters:
      - $ref: "#/components/parameters/PsmProjectId"
      - $ref: "#/components/parameters/PsmRecordId"
    post:
      tags: [Cloud platforms]
      summary: Explicitly validate a branch against Ecore and its optional EVL constraints
      responses:
        "200":
          description: Validation result; inspect valid and issues
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PsmWorkerResult"
  /api/projects/{projectId}/psm/branches/{id}/artifacts:
    parameters:
      - $ref: "#/components/parameters/PsmProjectId"
      - $ref: "#/components/parameters/PsmRecordId"
    get:
      tags: [Cloud platforms]
      summary: List artifact generation history for this branch
      responses:
        "200":
          description: Artifact summaries with source PSM revision; use the normal artifact APIs to inspect or download
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
                    sourceModelRevision: { type: integer }
                    createdAt: { type: string, format: date-time }
                    filePaths:
                      type: array
                      items: { type: string }
    post:
      tags: [Cloud platforms]
      summary: Generate artifacts using the branch's EGX and EGL package
      description: Creates a new artifact bundle tagged with branch, package and PSM revision. Does not run EVL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision]
              properties:
                expectedRevision: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Generated artifact bundle
          content:
            application/json:
              schema: { type: object }
        "409": { description: Branch revision changed }
        "422": { description: Structural conformance or generation failed }
  /api/projects/{projectId}/psm/branches/{id}/model.xmi:
    parameters:
      - $ref: "#/components/parameters/PsmProjectId"
      - $ref: "#/components/parameters/PsmRecordId"
    get:
      tags: [Cloud platforms]
      summary: Download a PSM branch as XMI
      responses:
        "200":
          description: Complete PSM model
          content:
            application/xml:
              schema: { type: string, format: binary }
components:
  securitySchemes:
    AuthToken:
      type: apiKey
      in: header
      name: X-Auth-Token
  parameters:
    PsmProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string }
    PsmRecordId:
      name: id
      in: path
      required: true
      schema: { type: string }
    ProjectId:
      name: id
      in: path
      required: true
      description: Identifier of the project to access.
      schema:
        type: string
    ModelId:
      name: id
      in: path
      required: true
      description: Identifier of the model at the path's modeling level.
      schema:
        type: string
    ArtifactId:
      name: id
      in: path
      required: true
      description: Identifier of the generated artifact.
      schema:
        type: string
    ModelLevelPath:
      name: level
      in: path
      required: true
      description: Modeling abstraction level selected by this request.
      schema:
        type: string
        enum: [cim, pim, psm]
    WildcardPath:
      name: path
      in: path
      required: true
      schema:
        type: string
      description: Wildcard path handled by a planned endpoint placeholder.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 256
      description: Replays the original async MDE job when the request fingerprint matches.
  requestBodies:
    TransformRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TransformRequest"
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    Unauthorized:
      description: Missing, invalid, or expired auth session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    Forbidden:
      description: Authenticated user does not have permission
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    NotFound:
      description: Record or file not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    Conflict:
      description: Revision or state conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    PayloadTooLarge:
      description: Upload or generated payload exceeds configured limits
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    UnsupportedMediaType:
      description: Uploaded media type or file format is not supported
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    NotImplemented:
      description: Planned feature placeholder
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    TransformationResponse:
      description: Transformation result
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TransformationResponse"
    MdeJobAccepted:
      description: MDE job accepted
      headers:
        Location:
          description: Polling URL for the accepted job
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JobResponse"
  schemas:
    PsmEditorSave:
      type: object
      required: [name, model]
      properties:
        name: { type: string, maxLength: 120 }
        expectedRevision: { type: integer, minimum: 0 }
        model: { type: object, additionalProperties: true }
    PsmPackageSummary:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        uploadedBy: { type: string }
        transformationEntry: { type: string }
        generationEntry: { type: string }
        hasValidation: { type: boolean }
        hasTransformation: { type: boolean }
        hasGeneration: { type: boolean }
        createdAt: { type: string, format: date-time }
    PsmBranchSummary:
      type: object
      properties:
        id: { type: string }
        packageId: { type: string }
        name: { type: string }
        sourcePimId: { type: string }
        sourcePimRevision: { type: integer }
        revision: { type: integer }
        updatedAt: { type: string, format: date-time }
    PsmBranch:
      allOf:
        - $ref: "#/components/schemas/PsmBranchSummary"
        - type: object
          properties:
            projectId: { type: string }
            createdBy: { type: string }
            sourcePimHash: { type: string, description: SHA-256 of the source XMI snapshot }
            xmi: { type: string }
            createdAt: { type: string, format: date-time }
    PsmWorkerResult:
      type: object
      properties:
        valid: { type: boolean }
        xmi: { type: [string, "null"] }
        schema:
          type: [array, "null"]
          items:
            type: object
            properties:
              name: { type: string }
              namespace: { type: string }
              abstract: { type: boolean }
              features:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    type: { type: string }
                    required: { type: boolean }
                    many: { type: boolean }
                    containment: { type: boolean }
                    literals:
                      type: array
                      items: { type: string }
        issues:
          type: array
          items: { type: string }
        files:
          type: object
          additionalProperties: { type: string }
    ApiErrorResponse:
      type: object
      required: [message, status, timestamp, issues, errorId]
      properties:
        message:
          type: string
        status:
          type: integer
        timestamp:
          type: string
          format: date-time
        issues:
          type: array
          items: {}
        errorId:
          type: string
          description: Correlation id for support and log lookup
    HealthResponse:
      type: object
      required: [status, service, timestamp]
      properties:
        status:
          type: string
          example: UP
        service:
          type: string
          example: modriss-backend
        timestamp:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      example:
        email: dev@example.com
        password: ExamplePassword123
        displayName: Dev Example
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        displayName:
          type: string
          maxLength: 80
    RegistrationResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Account created. Check your email for a verification link before signing in.
    LoginRequest:
      type: object
      required: [email, password]
      example:
        email: dev@example.com
        password: ExamplePassword123
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        publicIp:
          type: string
          maxLength: 45
          description: Optional client-reported IP used for login analytics.
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    PasswordResetRequestResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: If an account with that email exists, a password reset link has been sent.
    EmailVerificationRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    EmailVerificationRequestResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: >-
            If an unverified account with that email exists, a verification link has been sent.
    CompleteEmailVerificationRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
    CompletePasswordResetRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8
    UpdateMeRequest:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          maxLength: 80
    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/UserDto"
    UserDto:
      type: object
      required: [id, displayName, guest]
      properties:
        id:
          type: string
        email:
          type: [string, "null"]
          format: email
        displayName:
          type: string
        guest:
          type: boolean
    SaveProjectRequest:
      type: object
      required: [name]
      example:
        name: Order management
        description: Modeling workspace for the order management system.
      properties:
        name:
          type: string
        description:
          type: string
        activeModelIds:
          type: object
          additionalProperties:
            type: string
          description: Map of active model level or view keys to model ids.
    InviteRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          maxLength: 48
    UpdateMemberRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          maxLength: 48
    ProjectRecord:
      type: object
      required: [id, name, ownerUserId, activeModelIds, members, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        ownerUserId:
          type: string
        activeModelIds:
          type: object
          additionalProperties:
            type: string
        members:
          type: array
          items:
            $ref: "#/components/schemas/ProjectMember"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProjectMember:
      type: object
      required: [userId, email, displayName, role, addedAt]
      properties:
        userId:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          type: string
        addedAt:
          type: string
          format: date-time
    ModelLevel:
      type: string
      enum: [CIM, PIM, PSM]
    SaveModelRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        model:
          description: CIM, PIM, or PSM model JSON.
        projectId:
          type: string
        expectedRevision:
          type: integer
          format: int64
          description: Expected current revision; required when replacing a stored model.
    ModelValidationRequest:
      type: object
      required: [model]
      properties:
        model:
          description: Unsaved CIM, PIM, or PSM model JSON to validate.
    UpdateModelRequest:
      allOf:
        - $ref: "#/components/schemas/SaveModelRequest"
        - type: object
          required: [expectedRevision]
          properties:
            expectedRevision:
              type: integer
              format: int64
              description: Current stored revision required for optimistic concurrency.
    PatchModelRequest:
      type: object
      required: [expectedRevision]
      properties:
        name:
          type: string
        operations:
          type: array
          items:
            $ref: "#/components/schemas/ModelPatchOperation"
        expectedRevision:
          type: integer
          format: int64
    ModelPatchOperation:
      type: object
      required: [op, path]
      properties:
        op:
          type: string
          enum: [add, replace, remove]
        path:
          type: string
          description: JSON Pointer path.
        value:
          description: JSON value for add or replace.
    ExportRequest:
      type: object
      properties:
        name:
          type: string
        model:
          description: Model JSON used by unsaved export.
        format:
          type: string
          enum: [json, xmi]
          default: json
    ModelSummary:
      type: object
      required: [id, projectId, level, name, revision, createdAt, updatedAt]
      properties:
        id:
          type: string
        projectId:
          type: string
        level:
          $ref: "#/components/schemas/ModelLevel"
        name:
          type: string
        revision:
          type: integer
          format: int64
        metamodelVersion:
          type: string
        migrationState:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ModelRecord:
      allOf:
        - $ref: "#/components/schemas/ModelSummary"
        - type: object
          properties:
            modelJson:
              description: Stored model JSON.
            metamodelHash:
              type: string
            sourceXmiHash:
              type: string
    ValidationResult:
      type: object
      required: [valid, issues]
      properties:
        valid:
          type: boolean
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
    SynchronizationResult:
      type: object
      required:
        [
          status,
          targetModelId,
          incomingChanges,
          preservedUserChanges,
          autoMergedChanges,
          conflicts,
          generatedAdditions,
          generatedDeletions,
          conflictDetails,
          validationFindings,
        ]
      properties:
        status:
          type: string
          enum: [APPLIED, CONFLICTS, BOOTSTRAP_REQUIRED, VALIDATION_FAILED]
        sessionId:
          type: [string, "null"]
        targetModelId: { type: string }
        incomingChanges: { type: integer }
        preservedUserChanges: { type: integer }
        autoMergedChanges: { type: integer }
        conflicts: { type: integer }
        generatedAdditions: { type: integer }
        generatedDeletions: { type: integer }
        conflictDetails:
          type: array
          items:
            $ref: "#/components/schemas/ModelConflict"
        validationFindings:
          type: array
          items: { type: string }
    ModelConflict:
      type: object
      properties:
        conflictId: { type: string }
        transformationDirection:
          type: string
          enum: [CIM_TO_PIM, PIM_TO_AWS_PSM]
        elementId: { type: string }
        elementEClass: { type: string }
        elementName: { type: string }
        featureName: { type: string }
        differenceKind: { type: string }
        path: { type: string }
        baseValue: {}
        workingValue: {}
        generatedValue: {}
        description: { type: string }
        availableResolutions:
          type: array
          items:
            type: string
            enum: [KEEP_USER, TAKE_GENERATED]
    ConflictResolutionRequest:
      type: object
      required: [conflictId, resolution]
      properties:
        conflictId: { type: string }
        resolution:
          type: string
          enum: [KEEP_USER, TAKE_GENERATED]
    BatchConflictResolutionRequest:
      type: object
      required: [resolutions]
      properties:
        resolutions:
          type: object
          minProperties: 1
          additionalProperties:
            type: string
            enum: [KEEP_USER, TAKE_GENERATED]
    SynchronizationSession:
      type: object
      required:
        [
          id,
          direction,
          projectId,
          sourceModelId,
          targetModelId,
          workingRevision,
          baselineVersion,
          conflicts,
          resolutions,
        ]
      properties:
        id: { type: string }
        direction:
          type: string
          enum: [CIM_TO_PIM, PIM_TO_AWS_PSM]
        projectId: { type: string }
        sourceModelId: { type: string }
        targetModelId: { type: string }
        workingRevision: { type: integer, format: int64 }
        workingFingerprint: { type: string }
        baselineVersion: { type: integer, format: int64 }
        newSourceRevision: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/ModelConflict"
        resolutions:
          type: object
          additionalProperties:
            type: string
            enum: [KEEP_USER, TAKE_GENERATED]
    ValidationIssue:
      type: object
      properties:
        severity:
          type: string
        constraint:
          type: string
        issueClass:
          type: string
        message:
          type: string
        guidance:
          type: string
        elementId:
          type: string
        elementName:
          type: string
    ImportResult:
      type: object
      required: [name, modelJson, issues]
      properties:
        name:
          type: string
        modelJson:
          description: Imported model JSON.
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
    CreateAssistantSessionRequest:
      type: object
      required: [modelType, projectId]
      example:
        modelType: cim
        modelName: Retail ordering
        projectId: project-123
      properties:
        modelType:
          type: string
          enum: [cim, pim]
        modelName: { type: string }
        initialDocument:
          type: string
          description: Legacy initial document hint.
        projectId: { type: string }
        resumeSessionId: { type: string }
        forceNew: { type: boolean }
    CreateAssistantSessionResponse:
      type: object
      required: [sessionId]
      properties:
        sessionId: { type: string }
        modelId:
          type: [string, "null"]
        modelName:
          type: [string, "null"]
    AssistantConversation:
      type: object
      properties:
        sessionId: { type: string }
        title: { type: string }
        preview: { type: string }
        updatedAt: { type: string, format: date-time }
        messageCount: { type: integer }
    AssistantMessageRequest:
      type: object
      required: [message, idempotencyKey]
      example:
        message: Add a customer and an order to the model.
        modelId: model-123
        expectedRevision: 4
        activeView: CIM
        selectedElementIds: []
        attachmentIds: []
        idempotencyKey: turn-2026-10-13-001
      description: >-
        Unified chatbot request. model/revision and selection are authoritative structural context;
        they are not hints for a client-selected modeling engine.
      properties:
        message:
          type: string
        modelId:
          type: string
        revision:
          type: integer
          format: int64
        expectedRevision:
          type: integer
          format: int64
        activeView:
          type: string
          enum: [CIM, PIM]
          description: Current assistant-supported canvas level. PSM assistant sessions are unsupported.
        selectedElementIds:
          type: array
          items:
            type: string
        attachmentIds:
          type: array
          maxItems: 3
          items:
            type: string
        attachmentName:
          type: string
          description: Optional inline attachment name. Prefer uploaded attachmentIds for files.
        attachmentContent:
          type: string
          maxLength: 120000
          description: Optional inline text attachment content.
        idempotencyKey:
          type: string
    AssistantAttachmentResponse:
      type: object
      required: [id, fileName, contentType, sizeBytes]
      properties:
        id:
          type: string
        fileName:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        level:
          type: string
        projectId:
          type: string
        uploadedAt:
          type: string
          format: date-time
    TurnAcceptedResponse:
      type: object
      required: [turnId, state, eventCursor]
      properties:
        turnId:
          type: string
        state:
          $ref: "#/components/schemas/AssistantTurnState"
        modelId:
          type: string
        revision:
          type: integer
          format: int64
        acceptedAt:
          type: string
          format: date-time
        deadlineAt:
          type: string
          format: date-time
        eventCursor:
          type: integer
          format: int64
    TurnStatusResponse:
      type: object
      required: [turnId, state, checkpointCount, savedElementCount, providerCalls]
      properties:
        turnId:
          type: string
        state:
          $ref: "#/components/schemas/AssistantTurnState"
        modelId:
          type: string
        revision:
          type: integer
          format: int64
        checkpoints:
          type: array
          items:
            $ref: "#/components/schemas/AssistantCheckpoint"
        checkpointCount:
          type: integer
        savedElementCount:
          type: integer
        coveragePercent:
          type: integer
          minimum: 0
          maximum: 100
          description: >-
            Enforced source and/or mandatory-obligation accounting for the active workflow. This is
            not EVL semantic validity.
        remainingWork:
          type: string
        finalMessage:
          type: string
        providerCalls:
          type: integer
        promptTokens:
          type: integer
          format: int64
        completionTokens:
          type: integer
          format: int64
        repairAttempts:
          type: integer
        provenance:
          type: array
          items:
            $ref: "#/components/schemas/AssistantProvenance"
        continuations:
          type: array
          items:
            $ref: "#/components/schemas/AssistantContinuation"
        workflowKind:
          type: string
          description: Diagnostic durable workflow identifier; observational, not client-selectable.
        phase:
          type: string
          description: Current persisted workflow phase.
        currentWorkItemId:
          type: string
        workItems:
          type: array
          items:
            $ref: "#/components/schemas/AssistantWorkItem"
    AssistantTurnState:
      type: string
      enum:
        [
          QUEUED,
          RUNNING,
          SUCCEEDED,
          PARTIAL,
          NEEDS_INPUT,
          NEEDS_CONFIRMATION,
          CONFLICTED,
          CANCELLED,
          TIMED_OUT,
          FAILED,
        ]
    AssistantCheckpoint:
      type: object
      description: >-
        Revision-checked assistant checkpoint accepted after structural Ecore/EMF validation. It
        does not assert EVL semantic validity.
      properties:
        checkpointId:
          type: integer
          format: int64
        ordinal:
          type: integer
        label:
          type: string
        modelId:
          type: string
        revision:
          type: integer
          format: int64
        status:
          type: string
    AssistantProvenance:
      type: object
