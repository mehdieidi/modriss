openapi: 3.1.0
info:
  title: MODRISS Backend API
  version: 0.0.1
  description: REST API for authentication, projects, CIM/PIM/PSM models, transformations, artifacts, modeling metadata, and diagram layout.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://127.0.0.1:8080
    description: Local development
security:
  - AuthToken: []
tags:
  - name: Health
    description: Backend status checks.
  - name: Auth
    description: User registration, login, session, and profile endpoints.
  - name: Projects
    description: Project records, active models, and membership.
  - name: Models
    description: CIM, PIM, and PSM model CRUD, validation, import, and export.
  - name: Transformations
    description: MDE transformations and job tracking.
  - name: Synchronizations
    description: Pending three-way model synchronization conflict resolution.
  - name: Artifacts
    description: Generated artifact records, files, and downloads.
  - name: Modeling
    description: Modeling UI configuration and layout services.
  - name: Assistant
    description: >-
      Unified durable AI modeling assistant sessions, turns, checkpoints, source provenance, and
      SSE replay. Clients do not select an internal agent/conceptual strategy. Assistant commits
      are gated by structural Ecore/EMF conformance; EVL remains a separate user-initiated API.
  - name: Future
    description: Planned feature placeholders that currently return 501.
paths:
  /api/health:
    get:
      tags: [Health]
      summary: Get backend health
      security: []
      responses:
        "200":
          description: Backend health status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: Created auth session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Create an auth session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Created auth session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/auth/guest:
    post:
      tags: [Auth]
      summary: Create an anonymous guest session
      description: Creates an isolated guest account. Guest accounts are limited to five assistant prompts by default.
      security: []
      responses:
        "200":
          description: Created guest session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Auth]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: End the current auth session
      responses:
        "200":
          description: Session ended
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/projects:
    get:
      tags: [Projects]
      summary: List projects visible to the current user
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveProjectRequest"
      responses:
        "200":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/projects/{id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      summary: Get a project
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Projects]
      summary: Update a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveProjectRequest"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [Projects]
      summary: Delete a project
      responses:
        "200":
          description: Project deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/projects/{id}/download:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      summary: Download project ZIP
      responses:
        "200":
          description: Project ZIP archive
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{id}/members:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      summary: List project members
      responses:
        "200":
          description: Project members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/projects/{id}/invite:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [Projects]
      summary: Invite an existing user to a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteRequest"
      responses:
        "200":
          description: Added member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{id}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: userId
        in: path
        required: true
        schema:
          type: string
    put:
      tags: [Projects]
      summary: Update a project member role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRoleRequest"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Projects]
      summary: Revoke project access
      responses:
        "200":
          description: Access revoked
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/{level}:
    parameters:
      - $ref: "#/components/parameters/ModelLevelPath"
    get:
      tags: [Models]
      summary: List CIM, PIM, or PSM model summaries
      parameters:
        - name: projectId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Model summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModelSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Models]
      summary: Create a CIM, PIM, or PSM model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveModelRequest"
      responses:
        "200":
          description: Created model summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/{level}/{id}:
    parameters:
      - $ref: "#/components/parameters/ModelLevelPath"
      - $ref: "#/components/parameters/ModelId"
    get:
      tags: [Models]
      summary: Get a stored model
      responses:
        "200":
          description: Model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Models]
      summary: Replace a stored model
      description: Requires `expectedRevision`; returns 409 if the model has changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveModelRequest"
      responses:
        "200":
          description: Updated model summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    patch:
      tags: [Models]
      summary: Patch a stored model
      description: Supports JSON Pointer `add`, `replace`, and `remove` operations. Root replacement is not supported.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchModelRequest"
      responses:
        "200":
          description: Updated model summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Models]
      summary: Delete a stored model
      responses:
        "200":
          description: Model deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/{level}/validate:
    parameters:
      - $ref: "#/components/parameters/ModelLevelPath"
    post:
      tags: [Models]
      summary: Validate unsaved model JSON
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveModelRequest"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/{level}/validate/structural:
    parameters:
      - $ref: "#/components/parameters/ModelLevelPath"
    post:
      tags: [Models]
      summary: Validate unsaved model JSON for structural Ecore/EMF conformance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveModelRequest"
      responses:
        "200":
          description: Structural validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/{level}/{id}/validate:
    parameters:
      - $ref: "#/components/parameters/ModelLevelPath"
      - $ref: "#/components/parameters/ModelId"
    post:
      tags: [Models]
      summary: Validate a stored model
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/{level}/{id}/validate/structural:
    parameters:
      - $ref: "#/components/parameters/ModelLevelPath"
      - $ref: "#/components/parameters/ModelId"
    post:
      tags: [Models]
      summary: Validate a stored model for structural Ecore/EMF conformance
      responses:
        "200":
          description: Structural validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/{level}/{id}/validate/jobs:
    parameters:
      - $ref: "#/components/parameters/ModelLevelPath"
      - $ref: "#/components/parameters/ModelId"
    post:
      tags: [Models]
      summary: Submit asynchronous validation for a stored model
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedRevision:
                  type: integer
                  format: int64
      responses:
        "202":
          $ref: "#/components/responses/MdeJobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/{level}/export:
    parameters:
      - $ref: "#/components/parameters/ModelLevelPath"
    post:
      tags: [Models]
      summary: Export unsaved model JSON
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportRequest"
      responses:
        "200":
          description: Exported model file
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
            application/xml:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/{level}/{id}/export:
    parameters:
      - $ref: "#/components/parameters/ModelLevelPath"
      - $ref: "#/components/parameters/ModelId"
    post:
      tags: [Models]
      summary: Export a stored model
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportRequest"
      responses:
        "200":
          description: Exported model file
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
            application/xml:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/{level}/import:
    parameters:
      - $ref: "#/components/parameters/ModelLevelPath"
    post:
      tags: [Models]
      summary: Import model JSON or XMI
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [projectId, file]
              properties:
                projectId:
                  type: string
                format:
                  type: string
                  enum: [json, xmi]
                  default: json
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Imported model payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /api/transformations/cim-to-pim:
    post:
      tags: [Transformations]
      summary: Generate a PIM model from a CIM model
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/TransformRequest"
      responses:
        "202":
          $ref: "#/components/responses/MdeJobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/transformations/pim-to-psm:
    post:
      tags: [Transformations]
      summary: Generate a PSM model from a PIM model
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/TransformRequest"
      responses:
        "202":
          $ref: "#/components/responses/MdeJobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/transformations/psm-to-artifact:
    post:
      tags: [Transformations]
      summary: Generate deployable artifacts from a PSM model
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/TransformRequest"
      responses:
        "202":
          $ref: "#/components/responses/MdeJobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /api/transformations/jobs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Transformations]
      summary: Get a transformation job
      responses:
        "200":
          description: Job record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MdeJobRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/transformations/jobs/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Transformations]
      summary: Cancel a transformation job
      responses:
        "200":
          description: Cancelled job record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MdeJobRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/synchronizations/{projectId}/{sessionId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string }
      - name: sessionId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Synchronizations]
      summary: Get a pending model synchronization session and its conflicts
      responses:
        "200":
          description: Pending synchronization session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SynchronizationSession"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Synchronizations]
      summary: Cancel a pending model synchronization session
      responses:
        "204":
          description: Synchronization session cancelled
        "404":
          $ref: "#/components/responses/NotFound"
  /api/synchronizations/{projectId}/{sessionId}/resolutions:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string }
      - name: sessionId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Synchronizations]
      summary: Record a resolution for one model conflict
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConflictResolutionRequest"
      responses:
        "200":
          description: Updated pending synchronization session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SynchronizationSession"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/synchronizations/{projectId}/{sessionId}/resolutions/batch:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string }
      - name: sessionId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Synchronizations]
      summary: Record multiple conflict resolutions in one session update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchConflictResolutionRequest"
      responses:
        "200":
          description: Updated pending synchronization session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SynchronizationSession"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/synchronizations/{projectId}/{sessionId}/finalize:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string }
      - name: sessionId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Synchronizations]
      summary: Validate and commit a fully resolved synchronization session
      responses:
        "200":
          description: Synchronized working model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelRecord"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/artifact:
    get:
      tags: [Artifacts]
      summary: List artifacts for a project
      parameters:
        - name: projectId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Artifacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArtifactRecord"
        "401":
