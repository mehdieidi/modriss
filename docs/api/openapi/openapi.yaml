      properties:
        modelId: { type: string }
        level: { $ref: "#/components/schemas/ModelLevel" }
        revision: { type: integer, format: int64 }
        view:
          description: Persisted model view JSON after applying layout.
        layoutApplied: { type: boolean }
        nodeCount: { type: integer }
        edgeCount: { type: integer }
        warnings:
          type: array
          items: { type: string }
    ElementImpactResponse:
      type: object
      required: [focalElement, upstream, downstream, connectedElements]
      properties:
        focalElement: { $ref: "#/components/schemas/ImpactElement" }
